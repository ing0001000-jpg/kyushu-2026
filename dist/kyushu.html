<style>
/* ============================================================
   九州旅遊助手 — 旅の栞（旅行手帖）風格
   中性色偏冷灰綠，刻意避開暖奶油色；8 個地區各有專屬色相。
   ============================================================ */

/* ---------- 主題 tokens ---------- */
:root{
  --paper:#edf0ee; --card:#ffffff; --card2:#e4e9e6; --sunk:#e9edeb;
  --ink:#14222a; --ink2:#4a5b62; --ink3:#7b8a8f;
  --line:#d4dcd8; --line2:#b9c4bf;
  --brand:#cf4229; --brand-soft:#fae2dc;
  --ok:#2f7d5b; --ok-soft:#e0efe7;
  --warn:#8a5a12; --warn-soft:#fbeed6; --warn-line:#e7cf9e;
  --dgr:#a5271f; --dgr-soft:#fbe2df; --dgr-line:#eeb2ac;
  --sh-1:0 1px 2px rgba(20,34,42,.07);
  --sh-2:0 2px 4px rgba(20,34,42,.05),0 8px 20px rgba(20,34,42,.07);
  --display:"Archivo Black",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0c1418; --card:#15212a; --card2:#1e2c35; --sunk:#111c23;
  --ink:#e7eff0; --ink2:#a2b4ba; --ink3:#74878e;
  --line:#25343d; --line2:#354852;
  --brand:#f4795e; --brand-soft:#3a1e17;
  --ok:#68c39a; --ok-soft:#16302a;
  --warn:#e2b667; --warn-soft:#2f2716; --warn-line:#4a3e22;
  --dgr:#f2867c; --dgr-soft:#341d1a; --dgr-line:#54302c;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 2px 4px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#0c1418; --card:#15212a; --card2:#1e2c35; --sunk:#111c23;
  --ink:#e7eff0; --ink2:#a2b4ba; --ink3:#74878e;
  --line:#25343d; --line2:#354852;
  --brand:#f4795e; --brand-soft:#3a1e17;
  --ok:#68c39a; --ok-soft:#16302a;
  --warn:#e2b667; --warn-soft:#2f2716; --warn-line:#4a3e22;
  --dgr:#f2867c; --dgr-soft:#341d1a; --dgr-line:#54302c;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 2px 4px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
}

/* ---------- 地區色相 ---------- */
[data-reg="fukuoka"]{--rb:#e0483a}
[data-reg="nagasaki"]{--rb:#2b62ab}
[data-reg="kumamoto"]{--rb:#2f7d5b}
[data-reg="aso"]{--rb:#d1700f}
[data-reg="kurokawa"]{--rb:#7b5ea7}
[data-reg="yufuin"]{--rb:#0e8c8c}
[data-reg="beppu"]{--rb:#cf3f7a}
[data-reg="dazaifu"]{--rb:#a8752c}
[data-reg="journey"]{--rb:#cf4229}

[data-reg]{
  --reg:var(--rb);
  --reg-shade:color-mix(in srgb, var(--rb) 60%, #0b141a);
  --reg-tint:color-mix(in srgb, var(--rb) 15%, var(--card));
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) [data-reg]{
  --reg:color-mix(in srgb, var(--rb) 74%, #ffffff);
  --reg-shade:color-mix(in srgb, var(--rb) 74%, #000000);
  --reg-tint:color-mix(in srgb, var(--rb) 24%, var(--card));
}}
:root[data-theme="dark"] [data-reg]{
  --reg:color-mix(in srgb, var(--rb) 74%, #ffffff);
  --reg-shade:color-mix(in srgb, var(--rb) 74%, #000000);
  --reg-tint:color-mix(in srgb, var(--rb) 24%, var(--card));
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.68 var(--body);
  -webkit-font-smoothing:antialiased;overflow-wrap:anywhere;
}
h1,h2,h3{margin:0;font-weight:800;line-height:1.32;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}

/* ---------- topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
}
.tb-inner{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:620px;margin:0 auto}
.tb-text{min-width:0;flex:1}
#tb-title{font-size:17px;font-weight:800}
#tb-sub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.icon-btn{
  flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{background:var(--card2)}

/* ---------- layout ---------- */
#view{max-width:620px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:10px}

.sec-title{
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink3);
  margin:24px 0 10px
}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-title:first-child{margin-top:2px}

/* ---------- tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabbar a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 2px 9px;font-size:10.5px;font-weight:700;color:var(--ink3);min-height:54px
}
#tabbar .ti{display:block;width:22px;height:22px}
#tabbar svg{width:22px;height:22px}
#tabbar a.on{color:var(--brand)}

/* ---------- 插畫 ---------- */
.scene{width:100%;height:100%;display:block}
.art{position:relative;line-height:0;background:var(--reg-tint)}
.art .scene{height:100%}

.stamp{
  flex:none;width:46px;height:46px;border-radius:13px;overflow:hidden;
  display:block;border:1px solid var(--line);background:var(--reg-tint)
}
.stamp svg{width:100%;height:100%}

/* ---------- hero ---------- */
.hero{border-radius:20px;overflow:hidden;box-shadow:var(--sh-2);background:var(--card)}
.hero-art{height:126px;background:var(--reg-tint)}
.hero-body{background:var(--reg-shade);color:#fff;padding:15px 18px 17px}
.hero-body .eyebrow{opacity:.72}
.hero .big{font-family:var(--display);font-size:46px;line-height:1;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:15px;margin-left:6px;opacity:.8;font-family:var(--body);font-weight:800}
.hero h2{font-size:19px;margin-top:3px}
.hero .meta{font-size:12.5px;opacity:.82;margin-top:6px;line-height:1.55}

/* ---------- 進度 ---------- */
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog-row b{font-size:14.5px}
.prog-row span{font-family:var(--display);font-size:12px;color:var(--ink3)}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1)}
.card-p{padding:14px 16px}

/* ---------- 日卡（印章頁） ---------- */
.daycard{
  display:block;border-radius:18px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)
}
.daycard.now{border-color:var(--reg);box-shadow:0 0 0 3px var(--reg-tint),var(--sh-2)}
.dc-art{height:88px;position:relative;background:var(--reg-tint)}
.dc-badge{
  position:absolute;left:12px;top:12px;width:42px;height:42px;border-radius:50%;
  background:var(--card);color:var(--reg);display:grid;place-items:center;
  font-family:var(--display);font-size:18px;box-shadow:0 0 0 2.5px var(--reg)
}
.dc-flag{
  position:absolute;right:0;bottom:0;background:var(--reg);color:#fff;
  font-size:11px;font-weight:700;padding:4px 11px;border-radius:11px 0 0 0;letter-spacing:.02em
}
.dc-body{padding:12px 15px 13px}
.dc-date{font-family:var(--display);font-size:11.5px;color:var(--ink3);letter-spacing:.07em}
.dc-title{font-size:16px;font-weight:800;margin-top:3px}
.dc-region{font-size:12.5px;color:var(--reg);font-weight:700;margin-top:3px}
.dc-foot{
  display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)
}
.dc-foot svg{width:15px;height:15px;flex:none;color:var(--ink3)}

/* ---------- 時間軸 ---------- */
.part{margin-top:18px}
.part-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--reg)}
.part-h svg{width:17px;height:17px;flex:none}
.part-h b{font-size:13.5px;font-weight:800}
.part-h .pill{
  margin-left:auto;font-family:var(--display);font-size:10.5px;padding:2px 9px;border-radius:99px;
  background:var(--reg-tint);color:var(--reg)
}
.tl{position:relative;padding-left:21px}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--reg);opacity:.3;border-radius:2px}
.ev{position:relative;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1)}
.ev+.ev{margin-top:10px}
.ev::before{content:"";position:absolute;left:-20px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--reg);box-shadow:0 0 0 3px var(--paper)}
.ev-time{font-family:var(--display);font-size:11.5px;color:var(--reg);letter-spacing:.04em}
.ev-title{font-size:15.5px;font-weight:800;margin-top:2px}
.ev-desc{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.65}
.ev-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:7px;background:var(--reg-tint);color:var(--reg);margin-top:7px
}
.ev-tag svg{width:13px;height:13px}

/* ---------- 按鈕 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-right:7px;
  font-size:12.5px;font-weight:700;color:var(--reg);
  border:1.5px solid color-mix(in srgb, var(--reg) 38%, transparent);
  background:var(--reg-tint);padding:7px 12px;border-radius:10px
}
.btn svg{width:15px;height:15px;flex:none}
.btn:active{background:color-mix(in srgb, var(--reg) 26%, var(--card))}

/* ---------- 提示 ---------- */
.alert{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.65;border:1px solid;display:flex;gap:10px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.alert b{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;margin-bottom:3px}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.alert.danger{background:var(--dgr-soft);border-color:var(--dgr-line);color:var(--dgr)}
.alert.info{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 32%, transparent);color:var(--ok)}

.drive{
  display:flex;gap:10px;align-items:flex-start;font-size:13px;
  background:var(--sunk);border:1px dashed var(--line2);border-radius:14px;padding:11px 14px;color:var(--ink2)
}
.drive svg{width:17px;height:17px;flex:none;color:var(--reg);margin-top:2px}

/* ---------- 勾選清單 ---------- */
.grp{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--card2);border-bottom:1px solid var(--line)}
.grp-h .gi{font-size:19px;line-height:1}
.grp-h b{flex:1;font-size:14.5px;font-weight:800}
.grp-h .cnt{font-family:var(--display);font-size:11.5px;color:var(--ink3)}
.grp-note{font-size:12.5px;padding:10px 15px;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);line-height:1.6}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;cursor:pointer;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{
  appearance:none;-webkit-appearance:none;flex:none;margin:2px 0 0;
  width:22px;height:22px;border-radius:8px;border:2px solid var(--line2);background:var(--sunk);cursor:pointer
}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked::after{content:"✓";display:block;color:#fff;font-size:14px;font-weight:900;text-align:center;line-height:18px}
.chk-b{min-width:0;flex:1;display:block}
.chk-t{display:block;font-size:14.5px;font-weight:700}
.chk-d{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.55}
.chk input:checked~.chk-b .chk-t{text-decoration:line-through;color:var(--ink3);font-weight:500}
.chk .star{color:var(--brand)}
.chk-by{font-weight:800;color:var(--brand)}

/* ---------- 手風琴 ---------- */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);overflow:hidden}
details.acc+details.acc{margin-top:10px}
details.acc>summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-size:15px;font-weight:800}
.acc-t span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
details.acc>summary .caret{flex:none;color:var(--ink3);font-size:14px;transition:transform .2s}
details.acc[open]>summary .caret{transform:rotate(180deg)}
.acc-body{padding:0 15px 15px;border-top:1px solid var(--line);padding-top:13px}
.acc-ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.acc-ic svg{width:20px;height:20px}

/* ---------- 清單 ---------- */
.ilist{margin:0;padding:0;list-style:none}
.ilist li{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.65}
.ilist li:first-child{border-top:0;padding-top:1px}
.ilist .n{font-weight:800;font-size:14px}
.ilist .d{color:var(--ink2);font-size:12.5px;margin-top:2px}
.sub-h{
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--reg,var(--brand));
  margin:16px 0 6px;display:flex;align-items:center;gap:8px
}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sub-h:first-child{margin-top:0}

/* ---------- 定義列表 ---------- */
dl{margin:0}
.kv{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv dt{flex:none;width:70px;color:var(--ink3);font-size:12.5px;font-weight:700}
.kv dd{margin:0;flex:1;min-width:0}

/* ---------- 航班 ---------- */
.fl{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.fl:first-child{border-top:0;padding-top:2px}
.fl-code{flex:none;width:62px}
.fl-code b{font-family:var(--display);font-size:14px;display:block}
.fl-code span{font-size:10.5px;color:var(--ink3);display:block;margin-top:1px}
.fl-rt{display:flex;align-items:center;gap:9px}
.fl-rt .t{font-family:var(--display);font-size:16px}
.fl-rt .a{font-size:10.5px;color:var(--ink3);margin-top:1px}
.fl-rt .arrow{flex:1;height:1.5px;background:var(--line2);position:relative;min-width:20px;border-radius:2px}

        + '<div><div class="prog-row"><b>行前待辦</b><span>' + tDone + ' / ' + tIds.length + '</span></div>'
        + '<div class="prog"><i style="width:' + (tIds.length ? tDone / tIds.length * 100 : 0) + '%"></i></div></div>'
        + '<div><div class="prog-row"><b>行李打包</b><span>' + pDone + ' / ' + pIds.length + '</span></div>'
        + '<div class="prog"><i style="width:' + (pIds.length ? pDone / pIds.length * 100 : 0) + '%"></i></div></div>'
        + '</div>';

      h += '<div class="sec-title">行前待辦</div><div class="grp">'
        + TODOS.map(function (x) {
            var id = 't:' + x.id;
            return '<label class="chk"><input type="checkbox" data-k="' + esc(id) + '"' + (state.checks[id] ? ' checked' : '') + '>'
              + '<span class="chk-b"><span class="chk-t">' + esc(x.t) + '</span>'
              + '<span class="chk-d">' + esc(x.d) + '　<span class="chk-by">' + esc(x.by) + '</span></span></span></label>';
          }).join('')
        + '</div>';

      h += '<div class="sec-title">第一天</div>' + dayCard(TRIP.days[0], false);

    } else if (t > e) {
      h += '<div class="hero" data-reg="journey"><div class="hero-art">' + scene('journey') + '</div>'
        + '<div class="hero-body"><div class="eyebrow">旅程已結束</div>'
        + '<div class="big">9<small>天</small></div>'
        + '<h2>' + esc(TRIP.title) + '</h2>'
        + '<div class="meta">2026/09/27 – 10/05 · 歡迎回家</div></div></div>'
        + '<div class="sec-title">全部行程</div><div class="stack">'
        + TRIP.days.map(function (d) { return dayCard(d, false); }).join('') + '</div>';

    } else {
      var idx = dayDiff(s, t), day = TRIP.days[idx], reg = regOf(day.n), hotel = hotelOf(day.hotel);

      h += '<div class="hero" data-reg="' + esc(reg) + '"><div class="hero-art">' + scene(reg) + '</div>'
        + '<div class="hero-body"><div class="eyebrow">Day ' + day.n + ' · ' + esc(day.dow) + '</div>'
        + '<div class="big">' + fmtMD(day.date) + '</div>'
        + '<h2>' + esc(day.title) + '</h2>'
        + '<div class="meta">' + esc(day.region) + '</div></div></div>';

      h += '<div data-reg="' + esc(reg) + '">';
      if (day.alerts) h += '<div class="stack" style="margin-top:12px">' + alertsHtml(day.alerts) + '</div>';
      if (day.drive) h += '<div class="drive" style="margin-top:12px">' + I('car') + '<span>' + esc(day.drive) + '</span></div>';
      h += blocksHtml(day) + '</div>';

      h += hotel ? hotelCard(hotel, '今晚住宿')
                 : '<div class="sec-title">住宿</div><div class="card card-p"><div class="muted">當晚搭機返台，無住宿。</div></div>';
      h += regionEatHtml(day.n);
      h += '<div class="day-nav" data-reg="' + esc(reg) + '"><a class="wide" href="#/day/' + day.n + '">看今天完整行程 →</a></div>';
    }
    return h;
  }

  function viewPlan() {
    return '<div class="sec-title">9 天行程</div><div class="stack">'
      + TRIP.days.map(function (d) { return dayCard(d); }).join('') + '</div>'
      + '<div class="card card-p" style="margin-top:18px"><div class="muted">'
      + '行程內容擷取自《2026九州行程0927~1005.xls》，未經改寫。營業時間與價格請以現場公告為準。</div></div>';
  }

  function viewDay(n) {
    var d = null, i;
    for (i = 0; i < TRIP.days.length; i++) if (TRIP.days[i].n === n) d = TRIP.days[i];
    if (!d) return '<p>找不到這一天。</p>';
    var hotel = hotelOf(d.hotel), reg = regOf(d.n);

    var h = '<a class="back" href="#/plan">‹ 全部行程</a>'
      + '<div class="hero" data-reg="' + esc(reg) + '"><div class="hero-art">' + scene(reg) + '</div>'
      + '<div class="hero-body"><div class="eyebrow">Day ' + d.n + ' · ' + esc(d.date.replace(/-/g, '/')) + ' ' + esc(d.dow) + '</div>'
      + '<h2 style="font-size:21px;margin-top:6px">' + esc(d.title) + '</h2>'
      + '<div class="meta">' + esc(d.region) + '</div></div></div>';

    h += '<div data-reg="' + esc(reg) + '">';
    if (d.alerts) h += '<div class="stack" style="margin-top:12px">' + alertsHtml(d.alerts) + '</div>';
    if (d.drive) h += '<div class="drive" style="margin-top:12px">' + I('car') + '<span>' + esc(d.drive) + '</span></div>';
    h += blocksHtml(d) + '</div>';

    h += hotel ? hotelCard(hotel, d.n === 9 ? '住宿' : '今晚住宿')
               : '<div class="sec-title">住宿</div><div class="card card-p"><div class="muted">當晚搭機返台，無住宿。</div></div>';
    h += regionEatHtml(d.n);

    var prev = d.n > 1 ? '#/day/' + (d.n - 1) : null, next = d.n < 9 ? '#/day/' + (d.n + 1) : null;
    h += '<div class="day-nav">'
      + '<a class="' + (prev ? '' : 'dis') + '" href="' + (prev || '#') + '">‹ Day ' + (d.n - 1) + '</a>'
      + '<a class="' + (next ? '' : 'dis') + '" href="' + (next || '#') + '">Day ' + (d.n + 1) + ' ›</a></div>';
    return h;
  }

  function viewPack() {
    var ids = allPackIds(), done = doneCount(ids);
    var h = '<div class="card card-p">'
      + '<div class="prog-row"><b>打包進度</b><span>' + done + ' / ' + ids.length + '</span></div>'
      + '<div class="prog"><i style="width:' + (ids.length ? done / ids.length * 100 : 0) + '%"></i></div>'
      + '<div class="muted" style="margin-top:10px">勾選狀態只存在這支手機的瀏覽器裡，不會同步給其他人。</div></div>';

    h += '<div class="stack" style="margin-top:12px">' + PACKING.map(function (g) {
      var gi = g.items.map(function (i) { return 'p:' + g.id + ':' + i.id; }), gd = doneCount(gi);
      return '<div class="grp">'
        + '<div class="grp-h"><span class="gi">' + g.icon + '</span><b>' + esc(g.name) + '</b>'
        + '<span class="cnt">' + gd + '/' + gi.length + '</span></div>'
        + (g.note ? '<div class="grp-note">' + esc(g.note) + '</div>' : '')
        + g.items.map(function (i) {
            var id = 'p:' + g.id + ':' + i.id;
            return '<label class="chk"><input type="checkbox" data-k="' + esc(id) + '"' + (state.checks[id] ? ' checked' : '') + '>'
              + '<span class="chk-b"><span class="chk-t">' + (i.critical ? '<span class="star">★ </span>' : '') + esc(i.t) + '</span>'
              + (i.d ? '<span class="chk-d">' + esc(i.d) + '</span>' : '') + '</span></label>';
          }).join('')
        + '</div>';
    }).join('') + '</div>';
    return h;
  }

  var PRACT_IC = { drive: 'car', onsen: 'onsen', money: 'yen', weather: 'sun', emergency: 'alert' };

  function viewGuide() {
    var h = '<div class="sec-title">各區美食與景點</div><div class="stack">';
    h += GUIDE.regions.map(function (r) {
      return '<details class="acc" data-reg="' + esc(r.id) + '"><summary>'
        + '<span class="stamp"><svg viewBox="0 0 400 132" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + ART.scenes[r.id] + '</svg></span>'
        + '<span class="acc-t"><b>' + esc(r.name) + '</b><span>' + esc(r.days) + '</span></span>'
        + '<span class="caret">⌄</span></summary><div class="acc-body">'
        + '<div class="sub-h">吃什麼</div><ul class="ilist">'
        + r.eat.map(function (x) { return '<li><div class="n">' + esc(x.n) + '</div><div class="d">' + esc(x.d) + '</div></li>'; }).join('')
        + '</ul><div class="sub-h">看什麼</div><ul class="ilist">'
        + r.see.map(function (x) { return '<li><div class="n">' + esc(x.n) + '</div><div class="d">' + esc(x.d) + '</div></li>'; }).join('')
        + '</ul>'
        + (r.tips && r.tips.length ? '<div class="sub-h">小提醒</div><ul class="ilist">'
            + r.tips.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '')
        + '</div></details>';
    }).join('') + '</div>';

    h += '<div class="sec-title">實用資訊</div><div class="stack">';
    h += GUIDE.practical.map(function (pr) {
      return '<details class="acc"><summary>'
        + '<span class="acc-ic">' + I(PRACT_IC[pr.id] || 'info') + '</span>'
        + '<span class="acc-t"><b>' + esc(pr.title) + '</b></span>'
        + '<span class="caret">⌄</span></summary>'
        + '<div class="acc-body"><ul class="ilist">'
        + pr.items.map(function (x) { return '<li>' + md(x) + '</li>'; }).join('')
        + '</ul></div></details>';
    }).join('') + '</div>';

    h += '<div class="sec-title">常用日文</div><div class="stack">';
    h += GUIDE.phrases.map(function (g) {
      return '<details class="acc"><summary>'
        + '<span class="acc-ic">' + I('guide') + '</span>'
        + '<span class="acc-t"><b>' + esc(g.g) + '</b></span>'
        + '<span class="caret">⌄</span></summary><div class="acc-body">'
        + g.list.map(function (x) {
            return '<div class="ph"><div class="jp">' + esc(x.jp) + '</div>'
              + '<div class="tw">' + esc(x.tw) + '</div><div class="rm">' + esc(x.rm) + '</div></div>';
          }).join('')
        + '</div></details>';
    }).join('') + '</div>';

    h += '<div class="card card-p" style="margin-top:18px"><div class="muted">'
      + '本頁的景點與美食為一般旅遊建議，不是已排定的行程；營業時間、價格與活動舉辦與否請以官方即時公告為準。</div></div>';
    return h;
  }

  function viewInfo() {
    var h = '<div class="sec-title">航班</div><div class="card card-p">';
    h += TRIP.flights.map(function (f) {
      return '<div class="fl"><div class="fl-code"><b>' + esc(f.code) + '</b><span>' + esc(f.air) + '</span></div>'
        + '<div style="flex:1;min-width:0">'
        + '<div class="fl-rt"><div><div class="t">' + esc(f.dep) + '</div><div class="a">' + esc(f.from) + '</div></div>'
        + '<div class="arrow">' + I('plane') + '</div>'
        + '<div style="text-align:right"><div class="t">' + esc(f.arr) + '</div><div class="a">' + esc(f.to) + '</div></div></div>'
        + '<div class="fl-when">' + esc(f.date.replace(/-/g, '/')) + '<span class="whopill">' + esc(f.who) + '</span></div>'
        + '</div></div>';
    }).join('') + '</div>';

    h += '<div style="margin-top:11px">' + alertsHtml([{ level: 'danger',
      text: '**最後一天要分開行動。**兩團班機差 2 小時：小阿姨團（4 人）IT721 17:10 起飛，建議 15:10 前抵達機場報到，比行程表寫的「16:30 出發前往機場」早很多。澤右（2 人）BR101 19:20 起飛才符合原表格時間。' }]) + '</div>';

    h += '<div class="sec-title">租車</div><div class="card card-p" data-reg="fukuoka"><dl>'
      + '<div class="kv"><dt>取車</dt><dd>' + esc(TRIP.car.pickup.date.replace(/-/g, '/')) + ' ' + esc(TRIP.car.pickup.time) + '<br>' + esc(TRIP.car.pickup.place) + '</dd></div>'
      + '<div class="kv"><dt>還車</dt><dd>' + esc(TRIP.car.dropoff.date.replace(/-/g, '/')) + ' ' + esc(TRIP.car.dropoff.time) + '<br>' + esc(TRIP.car.dropoff.place) + '</dd></div>'
      + '</dl><ul class="ilist" style="margin-top:10px">'
      + TRIP.car.notes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'
      + navBtn(TRIP.car.pickup.map, '取車地點') + navBtn(TRIP.car.dropoff.map, '還車地點') + '</div>';

    h += '<div class="sec-title">住宿　6 筆訂房・8 晚</div><div class="stack">'
      + TRIP.hotels.map(function (ht) { return hotelCard(ht, null); }).join('') + '</div>';

    h += '<div class="sec-title">費用</div><div class="card card-p">';
    h += TRIP.hotels.map(function (ht) {
      return '<div class="total-row"><span>' + esc(ht.name) + '</span><span class="money">' + yen(ht.price) + '</span></div>';
    }).join('');
    h += '<div class="total-row grand"><span>住宿合計（日幣）</span><span class="money">' + yen(TRIP.budget.jpyTotal) + '</span></div>';
    h += '<div style="margin-top:14px">' + TRIP.budget.extra.map(function (x) {
      return '<div class="total-row"><span>' + esc(x.label) + '</span><span class="money">' + esc(x.amount) + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="muted" style="margin-top:12px">' + esc(TRIP.budget.note) + '</div></div>';

    h += '<div class="sec-title">日幣換算</div><div class="card card-p">'
      + '<div class="conv"><input id="jpy-in" type="number" inputmode="decimal" value="10000" aria-label="日圓金額">'
      + '<span class="eq">≈</span><div class="out" id="twd-out">—</div></div>'
      + '<div class="rate-row"><span>匯率　1 JPY =</span><input id="rate-in" type="number" inputmode="decimal" step="0.001" value="' + state.rate + '" aria-label="匯率"><span>TWD</span></div>'
      + '<div class="muted" style="margin-top:10px">匯率是離線手動設定值，出發前請自行更新為當日匯率。</div></div>';

    h += '<div class="sec-title">同行成員</div><div class="card card-p"><div style="font-size:13.5px">' + esc(TRIP.party) + '</div></div>';

    h += '<div class="card card-p" style="margin-top:18px"><div class="muted">'
      + '資料來源：《2026九州行程0927~1005.xls》。飯店地址與電話為網路查證結果，出發前建議再和訂房確認信核對一次。</div></div>';
    return h;
  }

  /* ---------- router ---------- */
  var TITLES = {
    today: ['今天', '2026/09/27 – 10/05'], plan: ['行程總覽', '九州自駕 9 天'],
    pack: ['行李打包', '出發前逐項確認'], guide: ['旅遊指南', '離線可用'],
    info: ['旅遊資訊', '航班・租車・住宿・費用']
  };

  function render() {
    var hash = location.hash || '#/today';
    var m = hash.match(/^#\/day\/(\d+)/), tab, html, i;
    if (m) {
      tab = 'plan'; html = viewDay(+m[1]);
      var dd = null;
      for (i = 0; i < TRIP.days.length; i++) if (TRIP.days[i].n === +m[1]) dd = TRIP.days[i];
      document.getElementById('tb-title').textContent = 'Day ' + m[1];
      document.getElementById('tb-sub').textContent = dd ? dd.date.replace(/-/g, '/') + '　' + dd.dow : '';
    } else {
      tab = hash.replace('#/', '') || 'today';
      if (!TITLES[tab]) tab = 'today';
      html = tab === 'today' ? viewToday() : tab === 'plan' ? viewPlan()
        : tab === 'pack' ? viewPack() : tab === 'guide' ? viewGuide() : viewInfo();
      document.getElementById('tb-title').textContent = TITLES[tab][0];
      document.getElementById('tb-sub').textContent = TITLES[tab][1];
    }

    var v = document.getElementById('view');
    v.innerHTML = html;
    window.scrollTo(0, 0);

    var links = document.querySelectorAll('#tabbar a');
    for (i = 0; i < links.length; i++) links[i].classList.toggle('on', links[i].dataset.tab === tab);

    if (tab === 'info') wireConverter();
  }

  function wireConverter() {
    var a = document.getElementById('jpy-in'), r = document.getElementById('rate-in'), o = document.getElementById('twd-out');
    if (!a) return;
    function calc() {
      var v = parseFloat(a.value), rate = parseFloat(r.value);
      o.textContent = (isFinite(v) && isFinite(rate))
        ? 'TWD ' + (v * rate).toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—';
    }
    a.addEventListener('input', calc);
    r.addEventListener('input', function () {
      var rate = parseFloat(r.value);
      if (isFinite(rate) && rate > 0) { state.rate = rate; save(); }
      calc();
    });
    calc();
  }

  document.getElementById('view').addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.type !== 'checkbox' || !el.dataset.k) return;
    if (el.checked) state.checks[el.dataset.k] = 1; else delete state.checks[el.dataset.k];
    save();
    var y = window.pageYOffset;
    render();
    window.scrollTo(0, y);
  });

  /* 分頁圖示：在啟動時注入，讓 index.html 保持乾淨 */
  (function () {
    var links = document.querySelectorAll('#tabbar a');
    for (var i = 0; i < links.length; i++) {
      var slot = links[i].querySelector('.ti');
      if (slot) slot.innerHTML = I(links[i].dataset.tab);
    }
    document.getElementById('theme-btn').innerHTML = I('moon');
  })();

  window.addEventListener('hashchange', render);
  if (!location.hash) location.replace('#/today');
  render();
  window.__render = render;

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();

</script>
