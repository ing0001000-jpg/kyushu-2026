  /* ---------- 密碼門檻 ----------
     說明：這是「擋一下」用的，不是資安機制。資料本身是明文，
     會看網頁原始碼的人可以繞過。詳見 README。 */
  var GATE_KEY = NS + 'gate';
  function hashPw(pw, salt) {
    var text = (salt || '') + ' ' + pw;
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
        var a = new Uint8Array(buf), out = '';
        for (var i = 0; i < a.length; i++) out += ('0' + a[i].toString(16)).slice(-2);
        return out;
      });
    }
    /* file:// 或舊瀏覽器沒有 crypto.subtle 時的退路 */
    var h1 = 0x811c9dc5, h2 = 0x1000193;
    for (var j = 0; j < text.length; j++) {
      h1 = ((h1 ^ text.charCodeAt(j)) * 16777619) >>> 0;
      h2 = ((h2 + text.charCodeAt(j) * (j + 7)) * 2654435761) >>> 0;
    }
    return Promise.resolve('fnv' + ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8));
  }
  window.__hashPw = hashPw;

  function gateSession() { try { return JSON.parse(localStorage.getItem(GATE_KEY) || 'null'); } catch (e) { return null; } }
  function gateNeeded() {
    var g = SITE.gate || {};
    if (!g.enabled || !g.entry) return false;
    var s = gateSession();
    return !(s && s.entry === g.entry);
  }
  window.__gateSession = gateSession;

  function showGate() {
    var g = SITE.gate || {};
    var n = (SITE.trips || []).length;
    var wrap = document.createElement('div');
    wrap.id = 'gate';
    wrap.innerHTML =
      '<div class="gate-card">'
      + '<div class="gate-mark">' + I('today') + '</div>'
      + '<h2>旅遊助手</h2>'
      + '<p class="gate-sub">' + (n > 1 ? n + ' 趟行程' : '家人朋友的行程小抄') + '</p>'
      + '<label>你的名字<input id="gate-name" type="text" autocomplete="nickname" placeholder="例：澤右"></label>'
      + '<label>密碼<input id="gate-pw" type="password" autocomplete="current-password"></label>'
      + '<button id="gate-go" class="btn-primary" type="button">進入</button>'
      + '<div id="gate-msg" class="gate-msg"></div>'
      + '</div>';
    document.body.appendChild(wrap);
    var nameEl = wrap.querySelector('#gate-name');
    var pwEl = wrap.querySelector('#gate-pw');
    var msg = wrap.querySelector('#gate-msg');
    function tryEnter() {
      var nm = nameEl.value.trim();
      if (!nm) { msg.textContent = '請先填你的名字'; nameEl.focus(); return; }
      msg.textContent = '檢查中…';
      hashPw(pwEl.value, g.salt).then(function (h) {
        if (h !== g.entry) { msg.textContent = '密碼不對'; pwEl.select(); return; }
        try { localStorage.setItem(GATE_KEY, JSON.stringify({ name: nm, entry: h, at: Date.now() })); } catch (e) {}
        wrap.remove();
        go();
      });
    }
    wrap.querySelector('#gate-go').addEventListener('click', tryEnter);
    wrap.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryEnter(); });
    setTimeout(function () { nameEl.focus(); }, 50);
  }

  /* ---------- 行程載入 ----------
     引擎只認 SITE.trips 的索引，內容在 trips/<id>/ 底下，進到那趟才載入。 */
  function tripMeta(id) {
    var ts = SITE.trips || [];
    for (var i = 0; i < ts.length; i++) if (ts[i].id === id) return ts[i];
    return null;
  }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var el = document.createElement('script');
      el.src = src; el.async = false;
      el.onload = function () { res(); };
      el.onerror = function () { rej(new Error(src + ' 載入失敗')); };
      document.head.appendChild(el);
    });
  }
  var artLoaded = {}, activeTrip = null;
  function ensureTrip(id) {
    if (activeTrip === id) return Promise.resolve();
    var meta = tripMeta(id);
    if (!meta) return Promise.reject(new Error('找不到這趟行程'));
    /* 單檔版（tools/build-single.js）已經把資料 inline 進來了，不用再抓 */
    if (window.__BUNDLED_TRIP === id) { bindTrip(id); activeTrip = id; return Promise.resolve(); }
    var base = 'trips/' + id + '/', chain = Promise.resolve();
    /* 先清空，免得某支載不到時還留著上一趟的資料 */
    TRIP_KEYS.forEach(function (k) { window[k] = null; });
    /* 每支都是選配：線上還沒發布的新行程靠本機草稿也要能開 */
    ['trip.js', 'guide.js', 'packing.js', 'places.js'].forEach(function (f) {
      chain = chain.then(function () { return loadScript(base + f).catch(function () {}); });
    });
    (meta.artPacks || []).forEach(function (pk) {
      if (artLoaded[pk]) return;
      chain = chain.then(function () {
        return loadScript('data/art/' + pk + '.js').then(function () { artLoaded[pk] = 1; }, function () {});
      });
    });
    return chain.then(function () { bindTrip(id); activeTrip = id; });
  }

  /* 沒指定要看哪趟時：優先進行中的，其次最近要出發的，再其次最近結束的 */
  function pickTrip() {
    var ts = (SITE.trips || []).slice();
    if (!ts.length) return null;
    var t = today(), live = null, next = null, past = null;
    ts.forEach(function (x) {
      var s0 = x.start ? dateObj(x.start) : null, e0 = x.end ? dateObj(x.end) : null;
      if (s0 && e0 && t >= s0 && t <= e0) live = live || x;
      else if (s0 && t < s0) { if (!next || dateObj(x.start) < dateObj(next.start)) next = x; }
      else if (e0) { if (!past || dateObj(x.end) > dateObj(past.end)) past = x; }
    });
    return (live || next || past || ts[0]).id;
  }
  function currentTripId() {
    var last = lsGet(NS + 'lastTrip');
    return (last && tripMeta(last)) ? last : pickTrip();
  }

  /* ---------- router ----------
     行程網址：#/<tripId>/today、#/<tripId>/day/3
     舊書籤 #/today、#/day/3 會自動導到上次看的那趟。 */
  var TAB_T = { today: '今天', plan: '行程總覽', pack: '行李打包', guide: '旅遊指南', info: '旅遊資訊' };
  function tabSub(tab) {
    if (tab === 'today') return fmtRange(TRIP.start, TRIP.end);
    if (tab === 'plan') return TRIP.days.length + ' 天行程';
    if (tab === 'pack') return '出發前逐項確認';
    if (tab === 'guide') return '離線可用';
    return '航班・住宿・費用';
  }
  function fmtRange(a, b) {
    if (!a || !b) return '';
    return a.replace(/-/g, '/') + ' – ' + b.slice(5).replace(/-/g, '/');
  }
  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var seg = h ? h.split('/') : [];
    if (!seg.length || !seg[0]) return { kind: 'home' };
    if (seg[0] === 'trips') return { kind: 'picker' };
    if (seg[0] === 'admin') return { kind: 'admin' };
    if (tripMeta(seg[0])) {
      var rest = seg.slice(1);
      if (rest[0] === 'admin') return { kind: 'admin', id: seg[0] };
      if (rest[0] === 'day') return { kind: 'trip', id: seg[0], tab: 'plan', day: +rest[1] };
      return { kind: 'trip', id: seg[0], tab: TAB_T[rest[0]] ? rest[0] : 'today' };
    }
    return { kind: 'legacy', tab: TAB_T[seg[0]] ? seg[0] : 'today', day: seg[0] === 'day' ? +seg[1] : null };
  }
  function hashFor(tab, day) {
    return '#/' + tripId + '/' + (day ? 'day/' + day : tab);
  }
  window.__hashFor = hashFor;

  function setBar(title, sub) {
    document.getElementById('tb-title').textContent = title;
    var el = document.getElementById('tb-sub');
    var multi = (SITE.trips || []).length > 1;
    if (multi && TRIP) {
      el.innerHTML = '<a class="tripsw" href="#/trips">' + esc(TRIP.title) + ' ▾</a>'
        + (sub ? '<span class="tb-dot">·</span>' + esc(sub) : '');
    } else {
      el.textContent = sub || '';
    }
  }
  function markTab(tab) {
    var links = document.querySelectorAll('#tabbar a');
    for (var i = 0; i < links.length; i++) {
      var t = links[i].dataset.tab;
      links[i].classList.toggle('on', t === tab);
      if (tripId) links[i].setAttribute('href', hashFor(t));
    }
  }
  function paint(html) {
    document.getElementById('view').innerHTML = html;
    window.scrollTo(0, 0);
  }

  /* ---------- 行程選單 ---------- */
  function tripStatus(x) {
    var t = today();
    if (!x.start || !x.end) return { cls: '', txt: '' };
    var s0 = dateObj(x.start), e0 = dateObj(x.end), d = dayDiff(t, s0);
    if (t > e0) return { cls: 'past', txt: '已結束' };
    if (t >= s0) return { cls: 'live', txt: '進行中・Day ' + (dayDiff(s0, t) + 1) };
    return { cls: 'soon', txt: d === 1 ? '明天出發' : '還有 ' + d + ' 天' };
  }
  function renderPicker() {
    var ts = (SITE.trips || []).slice().sort(function (a, b) {
      return String(b.start || '').localeCompare(String(a.start || ''));
    });
    document.getElementById('tb-title').textContent = '我的行程';
    document.getElementById('tb-sub').textContent = ts.length + ' 趟';
    var h = ts.length ? '<div class="stack triplist">' + ts.map(function (x) {
      var st = tripStatus(x);
      return '<a class="tripcard ' + st.cls + '" href="#/' + esc(x.id) + '/today"'
        + ' style="--rb:' + esc(x.color || '#cf4229') + '">'
        + '<div class="tc-bar"></div><div class="tc-b">'
        + (st.txt ? '<div class="tc-k">' + esc(st.txt) + '</div>' : '')
        + '<h3>' + esc(x.title || x.id) + '</h3>'
        + '<div class="meta">' + esc(fmtRange(x.start, x.end)) + '</div>'
        + '</div></a>';
    }).join('') + '</div>'
      : '<div class="card card-p"><div class="muted">還沒有任何行程。到後台新增一趟吧。</div></div>';
    h += '<div class="owner-row"><span></span><a href="#/admin">後台管理</a></div>';
    paint(h);
    markTab(null);
  }

  function showError(msg) {
    document.getElementById('tb-title').textContent = '載不到行程';
    document.getElementById('tb-sub').textContent = '';
    paint('<div class="card card-p"><div class="alert warn">' + I('alert')
      + '<div><b>提醒</b>' + esc(msg) + '</div></div>'
      + '<p class="muted" style="margin-top:10px">離線時只看得到之前開過的行程。</p>'
      + '<a class="btn" href="#/trips">回行程選單</a></div>');
    markTab(null);
  }

  function renderAdmin() {
    if (!window.KYUSHU_ADMIN) { location.replace(tripId ? hashFor('today') : '#/trips'); return; }
    document.getElementById('tb-title').textContent = '後台管理';
    document.getElementById('tb-sub').textContent = TRIP ? TRIP.title : '編輯行程與發布';
    document.getElementById('view').innerHTML = window.KYUSHU_ADMIN.view();
    window.scrollTo(0, 0);
    markTab(null);
    window.KYUSHU_ADMIN.wire();
  }

  function render(r) {
    r = r || parseHash();
    if (r.kind !== 'trip') { go(); return; }
    if (r.day) {
      var dd = null;
      for (var i = 0; i < TRIP.days.length; i++) if (TRIP.days[i].n === r.day) dd = TRIP.days[i];
      paint(viewDay(r.day));
      setBar('Day ' + r.day, dd ? dd.date.replace(/-/g, '/') + '　' + dd.dow : '');
      markTab('plan');
      return;
    }
    var tab = r.tab || 'today';
    paint(tab === 'today' ? viewToday() : tab === 'plan' ? viewPlan()
      : tab === 'pack' ? viewPack() : tab === 'guide' ? viewGuide() : viewInfo());
    setBar(TAB_T[tab], tabSub(tab));
    markTab(tab);
    if (tab === 'info') wireConverter();
  }

  function go() {
    if (gateNeeded()) return;
    var r = parseHash(), id;
    if (r.kind === 'picker') { renderPicker(); return; }
    if (r.kind === 'home') {
      id = currentTripId();
      location.replace(id ? '#/' + id + '/today' : '#/trips');
      return;
    }
    if (r.kind === 'legacy') {
      id = currentTripId();
      if (!id) { location.replace('#/trips'); return; }
      location.replace('#/' + id + '/' + (r.day ? 'day/' + r.day : r.tab));
      return;
    }
    if (r.kind === 'admin') {
      id = r.id || currentTripId();
      if (!id) { location.replace('#/trips'); return; }
      ensureTrip(id).then(renderAdmin, function (e) { showError(e.message); });
      return;
    }
    ensureTrip(r.id).then(function () { render(r); }, function (e) { showError(e.message); });
  }

  function wireConverter() {
    var a = document.getElementById('jpy-in'), r = document.getElementById('rate-in'), o = document.getElementById('twd-out');
    if (!a) return;
    function calc() {
      var v = parseFloat(a.value), rate = parseFloat(r.value);
      o.textContent = (isFinite(v) && isFinite(rate))
        ? 'TWD ' + (v * rate).toLocaleString('en-US', { maximumFractionDigits: 0 }) : '—';
    }
    a.addEventListener('input', calc);
    r.addEventListener('input', function () {
      var rate = parseFloat(r.value);
      if (isFinite(rate) && rate > 0) { state.rate = rate; save(); }
      calc();
    });
    calc();
  }

  document.getElementById('view').addEventListener('change', function (e) {
    var el = e.target;
    if (!el || el.type !== 'checkbox' || !el.dataset.k) return;
    if (el.checked) state.checks[el.dataset.k] = 1; else delete state.checks[el.dataset.k];
    save();
    var y = window.pageYOffset;
    render();
    window.scrollTo(0, y);
  });

  /* 今天頁跟著時間走：每分鐘、以及從背景切回來時重畫一次（正在打字時不打擾） */
  function refreshNow() {
    if (document.visibilityState === 'hidden' || gateNeeded()) return;
    var rr = parseHash();
    if (rr.kind !== 'trip' || (rr.tab !== 'today' && !rr.day)) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    var y = window.pageYOffset;
    render();
    window.scrollTo(0, y);
  }
  setInterval(refreshNow, 60000);
  document.addEventListener('visibilitychange', refreshNow);

  /* 自己要帶的項目：新增／刪除 */
  document.getElementById('view').addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || f.dataset.form !== 'mine') return;
    e.preventDefault();
    var t = (f.elements.t.value || '').replace(/\s+/g, ' ').trim();
    if (!t) return;
    state.mine.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: t.slice(0, 60) });
    save();
    var y = window.pageYOffset;
    render();
    window.scrollTo(0, y);
    var inp = document.querySelector('form[data-form="mine"] input');
    if (inp) inp.focus({ preventScroll: true });
  });
  document.getElementById('view').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-del]');
    if (!b) return;
    var id = b.dataset.del;
    state.mine = state.mine.filter(function (x) { return x.id !== id; });
    delete state.checks['m:' + id];
    save();
    var y = window.pageYOffset;
    render();
    window.scrollTo(0, y);
  });

  /* 分頁圖示：在啟動時注入，讓 index.html 保持乾淨 */
  (function () {
    var links = document.querySelectorAll('#tabbar a');
    for (var i = 0; i < links.length; i++) {
      var slot = links[i].querySelector('.ti');
      if (slot) slot.innerHTML = I(links[i].dataset.tab);
    }
    document.getElementById('theme-btn').innerHTML = I('moon');
  })();

  ART.mount();

  window.addEventListener('hashchange', function () { if (!gateNeeded()) go(); });
  if (gateNeeded()) showGate(); else go();
  window.__render = function () { go(); };

  /* 開發時網址加 ?nosw=1 可以不裝 Service Worker，免得改檔案還被舊快取蓋住 */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !/[?&]nosw=/.test(location.search)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();

/* 後台管理 — #/admin
   編輯後先存成「草稿」（只在這台裝置生效），按「發布」才會推到 GitHub、全團看得到。
   密碼由使用者自己設定，這支程式只存 SHA-256 雜湊，不存密碼原文。 */
(function () {
  'use strict';

  var TOKEN_KEY = 'hz:ghtoken';
  var SESSION_KEY = 'hz:adminok';
  var API = 'https://api.github.com';

  var tab = 'trip';      /* trip | book | places | pack | guide | setup */
  var dayIdx = 0;
  var unlocked = false;
  var busy = false;
  var flash = '';

  /* ---------- 小工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function site() { return window.SITE || (window.SITE = { gate: {}, repo: {}, trips: [] }); }
  function cfg() { return site(); }
  function tripId() { return window.__tripId(); }
  function tripMeta() {
    var ts = site().trips || [], id = tripId();
    for (var i = 0; i < ts.length; i++) if (ts[i].id === id) return ts[i];
    return null;
  }
  function saveDraft() { window.__saveData(); }
  function saveSite() { window.__saveSite(); }
  function rerender() { window.__render(); }
  function say(msg) { flash = msg; }

  /* 依路徑字串讀寫資料，例如 "TRIP.days.0.title" */
  function walk(path) {
    var parts = path.split('.'), o = window[parts[0]];
    for (var i = 1; i < parts.length - 1 && o != null; i++) o = o[parts[i]];
    return { obj: o, key: parts[parts.length - 1] };
  }
  function setPath(path, val) {
    var w = walk(path);
    if (w.obj) w.obj[w.key] = val;
  }
  function getPath(path) {
    var w = walk(path);
    return w.obj ? w.obj[w.key] : undefined;
  }

  /* ---------- 表單元件 ---------- */
  function field(label, path, opts) {
    opts = opts || {};
    var v = getPath(path);
    var attrs = 'data-p="' + esc(path) + '"';
    if (opts.placeholder) attrs += ' placeholder="' + esc(opts.placeholder) + '"';
    var input = opts.multiline
      ? '<textarea ' + attrs + ' rows="' + (opts.rows || 2) + '">' + esc(v) + '</textarea>'
      : '<input type="' + (opts.type || 'text') + '" ' + attrs + ' value="' + esc(v) + '">';
    return '<label class="af"><span>' + esc(label) + '</span>' + input + '</label>';
  }
  function selectField(label, path, options) {
    var v = getPath(path);
    return '<label class="af"><span>' + esc(label) + '</span><select data-p="' + esc(path) + '">'
      + options.map(function (o) {
          var val = o.v == null ? o : o.v, txt = o.t == null ? o : o.t;
          return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(txt) + '</option>';
        }).join('')
      + '</select></label>';
  }
  function rowTools(path, i, len, label) {
    return '<div class="arow-tools">'
      + '<button type="button" data-act="up" data-arr="' + esc(path) + '" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="上移">↑</button>'
      + '<button type="button" data-act="down" data-arr="' + esc(path) + '" data-i="' + i + '"' + (i === len - 1 ? ' disabled' : '') + ' aria-label="下移">↓</button>'
      + '<button type="button" class="danger" data-act="del" data-arr="' + esc(path) + '" data-i="' + i + '" data-label="' + esc(label || '') + '">刪除</button>'
      + '</div>';
  }
  function addBtn(path, kind, text) {
    return '<button type="button" class="a-add" data-act="add" data-arr="' + esc(path) + '" data-kind="' + esc(kind) + '">＋ ' + esc(text) + '</button>';
  }

  /* ---------- 各分頁 ---------- */
  /* 地區清單的單一真相就是 TRIP.regions，不再另外維護一份 */
  function regionOpts() {
    return ((window.TRIP && window.TRIP.regions) || []).map(function (r) {
      return { v: r.id, t: r.name || r.id };
    });
  }
  var PART_LABEL = { am: '上午', pm: '下午', night: '晚上' };

  function tabTrip() {
    var days = window.TRIP.days;
    if (dayIdx >= days.length) dayIdx = days.length - 1;
    var d = days[dayIdx], base = 'TRIP.days.' + dayIdx;

    var h = '<div class="a-daypick">' + days.map(function (x, i) {
      return '<button type="button" class="a-chip' + (i === dayIdx ? ' on' : '') + '" data-act="day" data-i="' + i + '">'
        + 'Day ' + x.n + '</button>';
    }).join('') + '</div>';

    h += '<div class="a-card">'
      + field('日期', base + '.date', { placeholder: '2026-09-27' })
      + field('星期', base + '.dow', { placeholder: '週日' })
      + field('地區標題', base + '.region')
      + field('當天標題', base + '.title')
      + selectField('住宿', base + '.hotel', [{ v: '', t: '（無）' }].concat(
          (window.TRIP.hotels || []).map(function (ht) { return { v: ht.key, t: ht.name }; })))
      + '</div>';

    (d.blocks || []).forEach(function (b, bi) {
      var bp = base + '.blocks.' + bi + '.items';
      h += '<div class="a-sec"><h3>' + esc(PART_LABEL[b.part] || b.part) + '</h3>';
      h += (b.items || []).map(function (it, i) {
        var ip = bp + '.' + i;
        return '<div class="a-row">' + rowTools(bp, i, b.items.length, it.title)
          + field('時間', ip + '.time', { placeholder: '10:00' })
          + field('標題', ip + '.title')
          + field('說明', ip + '.desc', { multiline: true, rows: 3 })
          + field('標籤', ip + '.tag', { placeholder: '例：長榮 BR106' })
          + field('導航關鍵字', ip + '.map', { placeholder: '日文地名或 緯度,經度' })
          + '</div>';
      }).join('');
      h += addBtn(bp, 'event', '新增一個項目') + '</div>';
    });
    return h;
  }

  function tabBook() {
    var h = '<div class="a-sec"><h3>航班</h3>';
    h += window.TRIP.flights.map(function (f, i) {
      var p = 'TRIP.flights.' + i;
      return '<div class="a-row">' + rowTools('TRIP.flights', i, window.TRIP.flights.length, f.code)
        + field('航班代號', p + '.code') + field('航空公司', p + '.air') + field('誰', p + '.who')
        + field('日期', p + '.date') + field('起點', p + '.from') + field('終點', p + '.to')
        + field('起飛', p + '.dep') + field('抵達', p + '.arr') + '</div>';
    }).join('') + addBtn('TRIP.flights', 'flight', '新增航班') + '</div>';

    h += '<div class="a-sec"><h3>租車</h3><div class="a-card">'
      + field('取車日期', 'TRIP.car.pickup.date') + field('取車時間', 'TRIP.car.pickup.time')
      + field('取車地點', 'TRIP.car.pickup.place') + field('取車導航', 'TRIP.car.pickup.map')
      + field('還車日期', 'TRIP.car.dropoff.date') + field('還車時間', 'TRIP.car.dropoff.time')
      + field('還車地點', 'TRIP.car.dropoff.place') + field('還車導航', 'TRIP.car.dropoff.map')
      + '</div>';
    h += window.TRIP.car.notes.map(function (n, i) {
      return '<div class="a-row">' + rowTools('TRIP.car.notes', i, window.TRIP.car.notes.length, n)
        + field('提醒 ' + (i + 1), 'TRIP.car.notes.' + i, { multiline: true }) + '</div>';
    }).join('') + addBtn('TRIP.car.notes', 'text', '新增租車提醒') + '</div>';

    h += '<div class="a-sec"><h3>住宿</h3>';
    h += window.TRIP.hotels.map(function (ht, i) {
      var p = 'TRIP.hotels.' + i;
      return '<div class="a-row">' + rowTools('TRIP.hotels', i, window.TRIP.hotels.length, ht.name)
        + field('代號（勿隨意改）', p + '.key') + field('名稱', p + '.name') + field('英文名', p + '.en')
        + field('入住', p + '.nights') + field('地址', p + '.addr') + field('電話', p + '.tel')
        + field('導航關鍵字', p + '.map') + field('官網', p + '.site')
        + field('金額（日幣）', p + '.price', { type: 'number' })
        + field('房型／人數', p + '.rooms', { multiline: true })
        + '</div>';
    }).join('') + addBtn('TRIP.hotels', 'hotel', '新增住宿') + '</div>';

    h += '<div class="a-sec"><h3>費用</h3><div class="a-card">'
      + field('住宿合計（日幣）', 'TRIP.budget.jpyTotal', { type: 'number' })
      + field('備註', 'TRIP.budget.note', { multiline: true, rows: 4 }) + '</div></div>';
    return h;
  }

  function tabPlaces() {
    var P = window.PLACES;
    if (!P) return '<div class="a-empty">還沒有匯入收藏地點。</div>';
    var groups = regionOpts().filter(function (r) { return r.v !== 'journey'; })
      .map(function (r) { return { id: r.v, name: r.t, arr: 'PLACES.regions.' + r.v, list: (P.regions && P.regions[r.v]) || [] }; });
    groups.push({ id: '', name: '未分區', arr: 'PLACES.unassigned', list: P.unassigned || [] });

    return groups.map(function (g) {
      return '<div class="a-sec"><h3>' + esc(g.name) + '　<span class="a-count">' + g.list.length + '</span></h3>'
        + g.list.map(function (x, i) {
            var p = g.arr + '.' + i;
            return '<div class="a-row">'
              + '<div class="arow-tools">'
              + '<button type="button" class="danger" data-act="del" data-arr="' + esc(g.arr) + '" data-i="' + i + '" data-label="' + esc(x.n) + '">刪除</button>'
              + '</div>'
              + field('名稱', p + '.n')
              + field('備註', p + '.d', { multiline: true })
              + field('導航（緯度,經度）', p + '.map')
              + '<label class="af"><span>改分到</span><select data-act="move" data-arr="' + esc(g.arr) + '" data-i="' + i + '">'
              + '<option value="">（不動）</option>'
              + regionOpts().filter(function (r) { return r.v !== 'journey'; })
                  .map(function (r) { return '<option value="' + r.v + '">' + esc(r.t) + '</option>'; }).join('')
              + '<option value="__un">未分區</option>'
              + '</select></label>'
              + '</div>';
          }).join('')
        + (g.list.length ? '' : '<div class="a-empty">（空）</div>')
        + '</div>';
    }).join('');
  }

  function tabPack() {
    var h = '<div class="a-sec"><h3>行前待辦</h3>'
      + window.TODOS.map(function (t, i) {
          var p = 'TODOS.' + i;
          return '<div class="a-row">' + rowTools('TODOS', i, window.TODOS.length, t.t)
            + field('待辦', p + '.t') + field('說明', p + '.d', { multiline: true })
            + field('期限', p + '.by', { placeholder: '出發前 1 週' }) + '</div>';
        }).join('')
      + addBtn('TODOS', 'todo', '新增待辦') + '</div>';
    return h + window.PACKING.map(function (cat, ci) {
      var cp = 'PACKING.' + ci;
      return '<div class="a-sec"><h3>' + esc(cat.icon || '') + ' ' + esc(cat.name) + '</h3>'
        + '<div class="a-card">' + field('分類名稱', cp + '.name') + field('分類說明', cp + '.note', { multiline: true }) + '</div>'
        + cat.items.map(function (it, i) {
            var p = cp + '.items.' + i;
            return '<div class="a-row">' + rowTools(cp + '.items', i, cat.items.length, it.t)
              + field('項目', p + '.t') + field('說明', p + '.d', { multiline: true }) + '</div>';
          }).join('')
        + addBtn(cp + '.items', 'packitem', '新增項目') + '</div>';
    }).join('');
  }

  function tabGuide() {
    return window.GUIDE.regions.map(function (r, ri) {
      var rp = 'GUIDE.regions.' + ri;
      function block(kind, label) {
        var arr = rp + '.' + kind, list = r[kind] || [];
        return '<h4>' + esc(label) + '</h4>'
          + list.map(function (x, i) {
              var p = arr + '.' + i;
              return '<div class="a-row">' + rowTools(arr, i, list.length, x.n)
                + field('名稱', p + '.n') + field('說明', p + '.d', { multiline: true }) + '</div>';
            }).join('')
          + addBtn(arr, 'nd', '新增' + label);
      }
      var tipsArr = rp + '.tips', tips = r.tips || [];
      return '<div class="a-sec"><h3>' + esc(r.name) + '</h3>'
        + block('eat', '吃什麼') + block('see', '看什麼')
        + '<h4>小提醒</h4>'
        + tips.map(function (t, i) {
            return '<div class="a-row">' + rowTools(tipsArr, i, tips.length, t)
              + field('提醒 ' + (i + 1), tipsArr + '.' + i, { multiline: true }) + '</div>';
          }).join('')
        + addBtn(tipsArr, 'text', '新增提醒')
        + '</div>';
    }).join('');
  }

  function tabSetup() {
    var g = cfg().gate || {}, repo = cfg().repo || {};
    var hasToken = !!getToken();
    var h = '';

    h += '<div class="a-sec"><h3>密碼</h3><div class="a-card">'
      + '<p class="a-note">兩組密碼請設不一樣的：<b>進入密碼</b>全團都會知道，<b>後台密碼</b>只有你知道。留空＝不改。</p>'
      + '<label class="af"><span>進入密碼（給全團）</span><input type="password" id="pw-entry" autocomplete="new-password"></label>'
      + '<label class="af"><span>後台密碼（只有你）</span><input type="password" id="pw-admin" autocomplete="new-password"></label>'
      + '<label class="af a-check"><input type="checkbox" id="pw-enabled"' + (g.enabled ? ' checked' : '') + '><span>開啟進入密碼</span></label>'
      + '<button type="button" class="btn-primary" data-act="savepw">儲存密碼</button>'
      + '<p class="a-note">目前狀態：進入密碼 ' + (g.entry ? '已設定' : '未設定')
      + '、後台密碼 ' + (g.admin ? '已設定' : '未設定') + '。</p>'
      + '</div></div>';

    h += '<div class="a-sec"><h3>行程</h3><div class="a-card">'
      + '<p class="a-note">目前編輯的是 <b>' + esc((window.TRIP && window.TRIP.title) || tripId()) + '</b>。'
      + '下面可以開一趟新的 —— 開完會先存成這台裝置的草稿，按「發布到 GitHub」才會上線。</p>'
      + '<label class="af"><span>網址代號（英文小寫，例如 kyoto-2027）</span><input type="text" id="nt-id" placeholder="kyoto-2027" autocapitalize="off" autocorrect="off"></label>'
      + '<label class="af"><span>行程名稱</span><input type="text" id="nt-title" placeholder="2027 京都賞楓 6 日"></label>'
      + '<div class="a-2col">'
      + '<label class="af"><span>出發日</span><input type="date" id="nt-start"></label>'
      + '<label class="af"><span>回程日</span><input type="date" id="nt-end"></label>'
      + '</div>'
      + '<label class="af"><span>主色</span><input type="color" id="nt-color" value="#2b6ca8"></label>'
      + '<button type="button" class="btn-primary" data-act="newtrip">新增行程</button>'
      + '</div></div>';

    h += '<div class="a-sec"><h3>發布到 GitHub</h3><div class="a-card">'
      + '<p class="a-note">草稿只存在這台裝置。要讓其他 5 個人看到，按下面的「發布」。</p>'
      + field('帳號', 'SITE.repo.owner') + field('儲存庫', 'SITE.repo.name') + field('分支', 'SITE.repo.branch')
      + '<label class="af"><span>GitHub 存取權杖（Token）</span><input type="password" id="gh-token" autocomplete="off" placeholder="' + (hasToken ? '已存在這台裝置，留空＝不改' : 'ghp_… 或 github_pat_…') + '"></label>'
      + '<div class="a-btnrow">'
      + '<button type="button" data-act="savetoken">儲存權杖</button>'
      + (hasToken ? '<button type="button" class="danger" data-act="cleartoken">刪除權杖</button>' : '')
      + '</div>'
      + '<p class="a-note">建議用 <b>Fine-grained token</b>，只授權這一個 repo、權限只給 <b>Contents: Read and write</b>，並設一個到期日。權杖存在這台瀏覽器裡，等於這個 repo 的鑰匙 — 手機借人或遺失時記得到 GitHub 撤銷。</p>'
      + '<div class="a-btnrow">'
      + '<button type="button" class="btn-primary" data-act="publish"' + (busy ? ' disabled' : '') + '>發布到 GitHub</button>'
      + '</div>'
      + '<div id="pub-log" class="a-log"></div>'
      + '</div></div>';

    h += '<div class="a-sec"><h3>草稿</h3><div class="a-card">'
      + '<p class="a-note">' + (window.__hasDraft() ? '這台裝置有未發布的草稿。' : '目前沒有草稿，畫面顯示的是線上版內容。') + '</p>'
      + '<div class="a-btnrow">'
      + '<button type="button" data-act="export">匯出草稿 JSON</button>'
      + '<button type="button" class="danger" data-act="discard">丟棄草稿，還原線上版</button>'
      + '</div></div></div>';

    return h;
  }

  /* ---------- 主畫面 ---------- */
  var TABS = [
    { id: 'trip', t: '行程' }, { id: 'book', t: '航班住宿' }, { id: 'places', t: '收藏地點' },
    { id: 'pack', t: '打包' }, { id: 'guide', t: '指南' }, { id: 'setup', t: '設定與發布' }
  ];

  function lockScreen() {
    var g = cfg().gate || {};
    var first = !g.admin;
    return '<div class="a-lock">'
      + '<h2>' + (first ? '第一次進後台' : '後台管理') + '</h2>'
      + (first
          ? '<p>還沒設定後台密碼。先設一組，之後每次進來都要輸入。</p>'
            + '<label class="af"><span>設定後台密碼</span><input type="password" id="lock-pw" autocomplete="new-password"></label>'
            + '<label class="af"><span>再輸入一次</span><input type="password" id="lock-pw2" autocomplete="new-password"></label>'
            + '<button type="button" class="btn-primary" data-act="setadmin">設定並進入</button>'
          : '<label class="af"><span>後台密碼</span><input type="password" id="lock-pw" autocomplete="current-password"></label>'
            + '<button type="button" class="btn-primary" data-act="unlock">進入</button>')
      + '<div id="lock-msg" class="gate-msg"></div>'
      + '<p class="a-note">忘記密碼的話，把瀏覽器這個網站的資料清掉，或直接改 <code>data/site.js</code>。</p>'
      + '</div>';
  }

  function view() {
    try { unlocked = unlocked || sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) {}
    if (!unlocked) return lockScreen();

    var h = '';
    if (flash) { h += '<div class="a-flash">' + esc(flash) + '</div>'; flash = ''; }
    var ts = site().trips || [];
    if (ts.length > 1) {
      h += '<div class="a-trips">' + ts.map(function (x) {
        return '<a class="a-chip' + (x.id === tripId() ? ' on' : '') + '" href="#/' + esc(x.id) + '/admin">'
          + esc(x.title || x.id) + '</a>';
      }).join('') + '</div>';
    }
    h += '<div class="a-tabs">' + TABS.map(function (t) {
      return '<button type="button" class="a-chip' + (t.id === tab ? ' on' : '') + '" data-act="tab" data-tab="' + t.id + '">' + esc(t.t) + '</button>';
    }).join('') + '</div>';
    h += '<div class="a-body">'
      + (tab === 'trip' ? tabTrip() : tab === 'book' ? tabBook() : tab === 'places' ? tabPlaces()
        : tab === 'pack' ? tabPack() : tab === 'guide' ? tabGuide() : tabSetup())
      + '</div>';
    h += '<div class="a-foot"><a href="' + esc(window.__hashFor('today')) + '">← 回 App</a>'
      + '<span>' + (window.__hasDraft() ? '有未發布的草稿' : '與線上版一致') + '</span></div>';
    return h;
  }

  /* ---------- 新增項目的樣板 ---------- */
  function blank(kind) {
    switch (kind) {
      case 'event': return { time: '', title: '新項目', desc: '', map: '' };
      case 'flight': return { code: '', air: '', who: '', date: '', from: '', to: '', dep: '', arr: '' };
      case 'hotel': return { key: 'new' + Date.now().toString(36).slice(-4), nights: '', name: '新住宿', addr: '', tel: '', map: '', price: 0, rooms: '' };
      case 'packitem': return { id: 'p' + Date.now().toString(36), t: '新項目', d: '' };
      case 'todo': return { id: 't' + Date.now().toString(36), t: '新待辦', d: '', by: '' };
      case 'nd': return { n: '新項目', d: '' };
      case 'text': return '';
      default: return {};
    }
  }

  /* ---------- 事件 ---------- */
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }

  function wire() {
    var root = document.getElementById('view');
    /* #view 這個元素本身不會被換掉，innerHTML 換內容時監聽器會留著。
       每次重繪都重掛的話會累積，一次點擊被執行好幾遍，所以只掛一次。 */
    if (root.dataset.adminWired) return;
    root.dataset.adminWired = '1';

    /* 輸入即存 */
    root.addEventListener('input', function (e) {
      var el = e.target;
      if (!el.dataset || !el.dataset.p) return;
      var v = el.value;
      if (el.type === 'number') v = v === '' ? 0 : Number(v);
      setPath(el.dataset.p, v);
      if (el.dataset.p.indexOf('SITE.') === 0) saveSite(); else saveDraft();
    });

    root.addEventListener('change', function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.p && el.tagName === 'SELECT') {
        setPath(el.dataset.p, el.value); saveDraft(); rerender(); return;
      }
      if (el.dataset && el.dataset.act === 'move' && el.value) {
        var arr = getPath(el.dataset.arr), i = +el.dataset.i;
        if (!arr || !arr[i]) return;
        var item = arr.splice(i, 1)[0];
        var dest = el.value === '__un' ? window.PLACES.unassigned : window.PLACES.regions[el.value];
        dest.push(item);
        saveDraft(); say('已移動「' + item.n + '」'); rerender();
      }
    });

    root.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (!b || !b.dataset.act) return;
      var act = b.dataset.act;

      if (act === 'tab') { tab = b.dataset.tab; rerender(); return; }
      if (act === 'day') { dayIdx = +b.dataset.i; rerender(); return; }

      if (act === 'add') {
        var arr = getPath(b.dataset.arr);
        if (Array.isArray(arr)) { arr.push(blank(b.dataset.kind)); saveDraft(); rerender(); }
        return;
      }
      if (act === 'del') {
        var a2 = getPath(b.dataset.arr), i2 = +b.dataset.i;
        if (!Array.isArray(a2)) return;
        if (!window.confirm('確定刪除「' + (b.dataset.label || a2[i2]) + '」？')) return;
        a2.splice(i2, 1); saveDraft(); rerender();
        return;
      }
      if (act === 'up' || act === 'down') {
        var a3 = getPath(b.dataset.arr), i3 = +b.dataset.i, j = act === 'up' ? i3 - 1 : i3 + 1;
        if (!Array.isArray(a3) || j < 0 || j >= a3.length) return;
        var tmp = a3[i3]; a3[i3] = a3[j]; a3[j] = tmp;
        saveDraft(); rerender();
        return;
      }

      if (act === 'setadmin') return doSetAdmin(b);
      if (act === 'unlock') return doUnlock(b);
      if (act === 'savepw') return doSavePw();
      if (act === 'savetoken') return doSaveToken();
      if (act === 'cleartoken') return doClearToken();
      if (act === 'newtrip') return doNewTrip();
      if (act === 'publish') return doPublish();
      if (act === 'export') return doExport();
      if (act === 'discard') return doDiscard();
    });
  }

  function doSetAdmin() {
    var pw = document.getElementById('lock-pw').value;
    var pw2 = document.getElementById('lock-pw2').value;
    var msg = document.getElementById('lock-msg');
    if (pw.length < 4) { msg.textContent = '密碼至少 4 個字'; return; }
    if (pw !== pw2) { msg.textContent = '兩次輸入不一樣'; return; }
    var g = cfg().gate;
    if (!g.salt) g.salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    window.__hashPw(pw, g.salt).then(function (h) {
      g.admin = h;
      saveDraft();
      unlocked = true;
      try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
      tab = 'setup';
      say('後台密碼已設定。記得到「設定與發布」按發布，其他裝置才會生效。');
      rerender();
    });
  }

  function doUnlock() {
    var pw = document.getElementById('lock-pw').value;
    var msg = document.getElementById('lock-msg');
    var g = cfg().gate;
    msg.textContent = '檢查中…';
    window.__hashPw(pw, g.salt).then(function (h) {
      if (h !== g.admin) { msg.textContent = '密碼不對'; return; }
      unlocked = true;
      try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
      rerender();
    });
  }

  function doSavePw() {
    var g = cfg().gate;
    var e1 = document.getElementById('pw-entry').value;
    var a1 = document.getElementById('pw-admin').value;
    var on = document.getElementById('pw-enabled').checked;
    if (!g.salt) g.salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    var jobs = [];
    if (e1) jobs.push(window.__hashPw(e1, g.salt).then(function (h) { g.entry = h; }));
    if (a1) jobs.push(window.__hashPw(a1, g.salt).then(function (h) { g.admin = h; }));
    Promise.all(jobs).then(function () {
      if (on && !g.entry) { say('要開啟進入密碼，得先設一組進入密碼。'); rerender(); return; }
      g.enabled = on;
      saveDraft();
      say('密碼已存成草稿。按「發布到 GitHub」之後，其他人才會被擋。');
      rerender();
    });
  }

  function doSaveToken() {
    var v = document.getElementById('gh-token').value.trim();
    if (!v) { say('沒有輸入權杖，維持原樣。'); rerender(); return; }
    try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {}
    say('權杖已存在這台裝置。');
    rerender();
  }
  function doClearToken() {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    say('權杖已刪除。');
    rerender();
  }

  function doExport() {
    var data = {};
    ['TRIP', 'GUIDE', 'PLACES', 'PACKING', 'TODOS'].forEach(function (k) { data[k] = window[k]; });
    data.SITE = site();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = tripId() + '-draft-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function doDiscard() {
    if (!window.confirm('丟棄這台裝置上所有未發布的修改，還原成線上版？')) return;
    window.__resetData();
    unlocked = true;
    say('已還原成線上版。');
    rerender();
  }

  /* ---------- 新增行程 ----------
     產生一份最小可用的骨架存成草稿，馬上就能編輯；發布時才會寫進 repo。 */
  function daysBetween(a, b) {
    var out = [], d = new Date(a + 'T00:00:00'), end = new Date(b + 'T00:00:00'), n = 1;
    var DOW = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    while (d <= end && n < 100) {
      out.push({
        n: n, date: d.toISOString().slice(0, 10), dow: DOW[d.getDay()],
        region: '', title: '第 ' + n + ' 天', hotel: '',
        blocks: [{ part: 'am', where: '', items: [] }, { part: 'pm', where: '', items: [] }, { part: 'night', where: '', items: [] }]
      });
      d.setDate(d.getDate() + 1); n++;
    }
    return out;
  }
  function doNewTrip() {
    var id = (document.getElementById('nt-id').value || '').trim().toLowerCase();
    var title = (document.getElementById('nt-title').value || '').trim();
    var start = document.getElementById('nt-start').value;
    var end = document.getElementById('nt-end').value;
    var color = document.getElementById('nt-color').value || '#2b6ca8';
    if (!/^[a-z0-9][a-z0-9-]{1,40}$/.test(id)) { say('網址代號只能用英文小寫、數字和減號。'); rerender(); return; }
    if ((site().trips || []).some(function (x) { return x.id === id; })) { say('這個代號已經有人用了。'); rerender(); return; }
    if (!title) { say('先幫這趟旅行取個名字。'); rerender(); return; }
    if (!start || !end || end < start) { say('日期不對：回程日不能早於出發日。'); rerender(); return; }

    var days = daysBetween(start, end);
    var dayRegion = {};
    days.forEach(function (d) { dayRegion[d.n] = 'journey'; });

    var skeleton = {
      TRIP: {
        title: title, start: start, end: end, party: '',
        dayRegion: dayRegion,
        regions: [{
          id: 'journey', name: '移動中', art: 'core/journey',
          palette: { rb: color, sky: '#f6e7d2', far: '#f0b878', mid: '#2e6d8e', near: '#24333d', pop: color, pale: '#fff6e8' }
        }],
        flights: [], hotels: [], budget: { jpyTotal: 0, extra: [], note: '' },
        days: days
      },
      GUIDE: { regions: [], practical: [], phrases: [] },
      PACKING: [], TODOS: [],
      PLACES: { updated: '', regions: {}, unassigned: [] }
    };
    window.__seedTrip(id, skeleton);
    site().trips = (site().trips || []).concat([
      { id: id, title: title, start: start, end: end, color: color, artPacks: [] }
    ]);
    saveSite();
    say('「' + title + '」已建立（' + days.length + ' 天）。先編輯內容，好了再按發布。');
    location.hash = '#/' + id + '/admin';
  }

  /* ---------- 發布 ---------- */
  function b64(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function jsFile(header, pairs) {
    return header + '\n' + pairs.map(function (p) {
      return 'window.' + p[0] + ' = ' + JSON.stringify(p[1], null, 2) + ';';
    }).join('\n') + '\n';
  }

  function gh(path, opts) {
    var r = cfg().repo;
    opts = opts || {};
    opts.headers = Object.assign({
      'Authorization': 'Bearer ' + getToken(),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, opts.headers || {});
    return fetch(API + '/repos/' + r.owner + '/' + r.name + path, opts).then(function (res) {
      return res.text().then(function (t) {
        var j = null;
        try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!res.ok) {
          var m = (j && j.message) || res.statusText;
          throw new Error(res.status + ' ' + m);
        }
        return j;
      });
    });
  }

  function putFile(path, content, log) {
    var r = cfg().repo;
    return gh('/contents/' + path + '?ref=' + encodeURIComponent(r.branch))
      .then(function (j) { return j && j.sha; })
      .catch(function (e) {
        if (String(e.message).indexOf('404') === 0) return null;   /* 新檔 */
        throw e;
      })
      .then(function (sha) {
        var body = {
          message: '後台更新 ' + path + '（' + new Date().toISOString().slice(0, 16).replace('T', ' ') + '）',
          content: b64(content),
          branch: r.branch
        };
        if (sha) body.sha = sha;
        return gh('/contents/' + path, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      })
      .then(function () { log('✓ ' + path); });
  }

  function doPublish() {
    if (busy) return;
    var logEl = document.getElementById('pub-log');
    function log(s) { logEl.innerHTML += esc(s) + '<br>'; }
    logEl.innerHTML = '';

    if (!getToken()) { log('✗ 還沒設定 GitHub 權杖'); return; }
    var r = cfg().repo;
    if (!r.owner || !r.name) { log('✗ 帳號或儲存庫沒填'); return; }

    busy = true;
    var btn = document.querySelector('[data-act="publish"]');
    if (btn) { btn.disabled = true; btn.textContent = '發布中…'; }

    /* 每次發布把快取版本 +1，團員手機才會拿到新內容 */
    var ver = (Number(cfg().cacheVersion) || 1) + 1;
    cfg().cacheVersion = ver;

    /* 行程索引跟著行程資料走，不必人工維護兩份 */
    var id = tripId(), base = 'trips/' + id + '/', meta = tripMeta();
    if (meta) {
      meta.title = window.TRIP.title;
      meta.start = window.TRIP.start;
      meta.end = window.TRIP.end;
    }

    var files = [
      [base + 'trip.js', jsFile('/* 行程資料 — 由後台發布，手改會被下次發布覆蓋。 */', [['TRIP', window.TRIP]])],
      [base + 'guide.js', jsFile('/* 離線指南 — 由後台發布。景點／美食屬一般旅遊建議，非既定行程。 */', [['GUIDE', window.GUIDE]])],
      [base + 'packing.js', jsFile('/* 打包清單與待辦 — 由後台發布。改 id 會弄丟已勾選狀態。 */', [['PACKING', window.PACKING], ['TODOS', window.TODOS]])],
      ['data/site.js', jsFile('/* 站台設定與行程索引 — 由後台發布。存的是密碼雜湊，不是密碼本身。 */', [['SITE', site()]])],
      ['sw.js', null]   /* 稍後用讀回來的內容改版本號 */
    ];
    if (window.PLACES) {
      files.splice(3, 0, [base + 'places.js', jsFile('/* 收藏地點 — 由後台發布或 tools/import-places.js 產生。 */', [['PLACES', window.PLACES]])]);
    }

    log('快取版本 → v' + ver);

    /* 先把 sw.js 抓下來改版本號 */
    gh('/contents/sw.js?ref=' + encodeURIComponent(r.branch))
      .then(function (j) {
        var cur = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), function (c) { return c.charCodeAt(0); }));
        var re = /hz-v\d+/;
        /* 沒命中就不能默默發下去：版本號沒加，團員手機會永遠用舊快取 */
        if (!re.test(cur)) {
          throw new Error('sw.js 裡找不到快取版本號（預期 hz-vN），已中止發布。請先檢查 sw.js 的 CACHE 行。');
        }
        files[files.length - 1][1] = cur.replace(re, 'hz-v' + ver);
      })
      .then(function () {
        return files.reduce(function (chain, f) {
          return chain.then(function () { return f[1] == null ? null : putFile(f[0], f[1], log); });
        }, Promise.resolve());
      })
      .then(function () {
        log('');
        log('發布完成。GitHub Pages 約 1 分鐘後生效，團員重開 App 就會更新。');
        saveDraft(); saveSite();
      })
      .catch(function (e) {
        log('✗ 失敗：' + e.message);
        if (String(e.message).indexOf('401') === 0) log('  權杖無效或已過期，到設定重存一次。');
        if (String(e.message).indexOf('403') === 0) log('  權杖權限不足，需要 Contents: Read and write。');
        if (String(e.message).indexOf('409') === 0) log('  版本衝突，可能有人同時改了，重新整理後再試。');
      })
      .then(function () {
        busy = false;
        var b2 = document.querySelector('[data-act="publish"]');
        if (b2) { b2.disabled = false; b2.textContent = '發布到 GitHub'; }
      });
  }

  window.KYUSHU_ADMIN = { view: view, wire: wire };

  /* app.js 先跑完才載入這支，若一開啟就是 #/admin，補畫一次 */
  /* 直接用 #/…/admin 進來時，app.js 可能在 admin.js 載入前就先畫過一次 */
  if (/\/admin$/.test(location.hash) && window.__render) window.__render();
})();

</script>
