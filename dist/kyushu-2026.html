<style>
/* ============================================================
   九州旅遊助手 — 旅の栞（旅行手帖）風格
   中性色偏冷灰綠，刻意避開暖奶油色；8 個地區各有專屬色相。
   ============================================================ */

/* ---------- 主題 tokens ---------- */
:root{
  --paper:#edf0ee; --card:#ffffff; --card2:#e4e9e6; --sunk:#e9edeb;
  --ink:#14222a; --ink2:#4a5b62; --ink3:#7b8a8f;
  --line:#d4dcd8; --line2:#b9c4bf;
  --brand:#cf4229; --brand-soft:#fae2dc;
  --ok:#2f7d5b; --ok-soft:#e0efe7;
  --warn:#8a5a12; --warn-soft:#fbeed6; --warn-line:#e7cf9e;
  --dgr:#a5271f; --dgr-soft:#fbe2df; --dgr-line:#eeb2ac;
  --sh-1:0 1px 2px rgba(34,32,26,.06);
  --sh-2:0 2px 6px rgba(34,32,26,.055),0 12px 28px rgba(34,32,26,.075);
  /* 紙張纖維（SVG 雜訊，瀏覽器只算一次再平鋪，離線也沒問題） */
  --fiber:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='150' height='150' filter='url(%23f)' opacity='0.07'/></svg>");
  --display:"Archivo Black",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0c1418; --card:#15212a; --card2:#1e2c35; --sunk:#111c23;
  --ink:#e7eff0; --ink2:#a2b4ba; --ink3:#74878e;
  --line:#25343d; --line2:#354852;
  --brand:#f4795e; --brand-soft:#3a1e17;
  --ok:#68c39a; --ok-soft:#16302a;
  --warn:#e2b667; --warn-soft:#2f2716; --warn-line:#4a3e22;
  --dgr:#f2867c; --dgr-soft:#341d1a; --dgr-line:#54302c;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 2px 4px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#0c1418; --card:#15212a; --card2:#1e2c35; --sunk:#111c23;
  --ink:#e7eff0; --ink2:#a2b4ba; --ink3:#74878e;
  --line:#25343d; --line2:#354852;
  --brand:#f4795e; --brand-soft:#3a1e17;
  --ok:#68c39a; --ok-soft:#16302a;
  --warn:#e2b667; --warn-soft:#2f2716; --warn-line:#4a3e22;
  --dgr:#f2867c; --dgr-soft:#341d1a; --dgr-line:#54302c;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 2px 4px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);
}

/* ---------- 城市配色盤 ----------
   每座城市一組 6 色的有限色盤，是先決定「這座城市看起來像什麼顏色」
   才反推出來的，不是照片取色。插畫與 UI 共用同一組。
   --c-sky 紙／天空　--c-far 遠景　--c-mid 中景　--c-near 近景（墨）
   --c-pop 點綴（整張畫唯一的高彩度）　--c-pale 亮部（光／霧／白牆）
   --rb 是這個地區在 UI 上的主色。
   ------------------------------------------------------------ */
/* 實際的色盤值由 app.js 依 TRIP.regions[].palette 注入 <style id="hz-palette">，
   所以換一趟旅行不必動這支 CSS。下面這段推導規則是所有行程共用的。 */

[data-reg]{
  --sky:var(--c-sky); --far:var(--c-far); --mid:var(--c-mid);
  --near:var(--c-near); --pop:var(--c-pop); --pale:var(--c-pale);
  --reg:var(--rb);
  --reg-shade:color-mix(in srgb, var(--rb) 62%, #0b141a);
  --reg-tint:color-mix(in srgb, var(--rb) 14%, var(--card));
}
/* 深色主題：整張畫變成同一座城市的「夜間版海報」，
   紙色壓暗、點綴色反而更亮，構圖與辨識度不變。 */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) [data-reg]{
  --sky:color-mix(in srgb, var(--c-sky) 20%, #0d171d);
  --far:color-mix(in srgb, var(--c-far) 62%, #0e181e);
  --mid:color-mix(in srgb, var(--c-mid) 80%, #0b1319);
  --near:color-mix(in srgb, var(--c-near) 50%, #05090c);
  --pop:color-mix(in srgb, var(--c-pop) 88%, #ffffff);
  --pale:color-mix(in srgb, var(--c-pale) 62%, #16222a);
  --reg:color-mix(in srgb, var(--rb) 74%, #ffffff);
  --reg-shade:color-mix(in srgb, var(--rb) 70%, #000000);
  --reg-tint:color-mix(in srgb, var(--rb) 22%, var(--card));
}}
:root[data-theme="dark"] [data-reg]{
  --sky:color-mix(in srgb, var(--c-sky) 20%, #0d171d);
  --far:color-mix(in srgb, var(--c-far) 62%, #0e181e);
  --mid:color-mix(in srgb, var(--c-mid) 80%, #0b1319);
  --near:color-mix(in srgb, var(--c-near) 50%, #05090c);
  --pop:color-mix(in srgb, var(--c-pop) 88%, #ffffff);
  --pale:color-mix(in srgb, var(--c-pale) 62%, #16222a);
  --reg:color-mix(in srgb, var(--rb) 74%, #ffffff);
  --reg-shade:color-mix(in srgb, var(--rb) 70%, #000000);
  --reg-tint:color-mix(in srgb, var(--rb) 22%, var(--card));
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
/* 紙張纖維：整個介面墊在一張有顆粒的紙上，不是純色底 */
body{
  margin:0;color:var(--ink);
  background-color:var(--paper);
  background-image:var(--fiber);
  background-size:150px 150px;
  background-blend-mode:multiply;
  font:15px/1.68 var(--body);
  -webkit-font-smoothing:antialiased;overflow-wrap:anywhere;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) body{background-blend-mode:screen} }
:root[data-theme="dark"] body{background-blend-mode:screen}
h1,h2,h3{margin:0;font-weight:800;line-height:1.32;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}

/* ---------- topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
}
.tb-inner{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:620px;margin:0 auto}
.tb-text{min-width:0;flex:1}
#tb-title{font-size:17px;font-weight:800}
#tb-sub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.icon-btn{
  flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);cursor:pointer;display:grid;place-items:center;padding:0
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{background:var(--card2)}

/* ---------- layout ---------- */
#view{max-width:620px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:10px}

.sec-title{
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink3);
  margin:24px 0 10px
}
.sec-title::before{
  content:"";flex:none;width:8px;height:8px;border-radius:2px;
  background:var(--reg,var(--brand));transform:rotate(45deg);opacity:.85
}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-title:first-child{margin-top:2px}

/* ---------- tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabbar a{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 2px 9px;font-size:10.5px;font-weight:700;color:var(--ink3);min-height:54px
}
#tabbar a>*{position:relative;z-index:1}
#tabbar a.on::before{
  content:"";position:absolute;z-index:0;top:5px;left:50%;transform:translateX(-50%);
  width:46px;height:28px;border-radius:99px;background:var(--brand-soft)
}
#tabbar .ti{display:block;width:22px;height:22px}
#tabbar svg{width:22px;height:22px}
#tabbar a.on{color:var(--brand)}

/* ---------- 城市印象插畫 ---------- */
.scene{width:100%;height:100%;display:block}
.art{position:relative;line-height:0;background:var(--sky)}
.art .scene{height:100%}
/* 顆粒疊在畫面上：淺色主題用 multiply（像鉛筆壓在紙上），
   深色主題改 soft-light，免得整張畫被壓死 */
.gr{mix-blend-mode:multiply;opacity:.6}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gr{mix-blend-mode:soft-light;opacity:.7} }
:root[data-theme="dark"] .gr{mix-blend-mode:soft-light;opacity:.7}

.stamp{
  flex:none;width:50px;height:50px;border-radius:14px;overflow:hidden;
  display:block;background:var(--sky);
  box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(20,34,42,.1)
}
.stamp svg{width:100%;height:100%}

/* ---------- hero ---------- */
.hero{border-radius:20px;overflow:hidden;box-shadow:var(--sh-2);background:var(--card)}
/* 用 aspect-ratio 而不是固定高度：不管螢幕多寬，整張構圖都完整看得到 */
.hero-art{aspect-ratio:400/132;background:var(--sky)}
.hero-body{
  background-color:var(--reg-shade);background-image:var(--fiber);
  background-size:150px 150px;background-blend-mode:soft-light;
  color:#fff;padding:15px 18px 17px
}
.hero-body .eyebrow{opacity:.72}
.hero .big{font-family:var(--display);font-size:46px;line-height:1;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:15px;margin-left:6px;opacity:.8;font-family:var(--body);font-weight:800}
.hero h2{font-size:19px;margin-top:3px}
.hero .meta{font-size:12.5px;opacity:.82;margin-top:6px;line-height:1.55}

/* ---------- 現在：跟著行程走 ---------- */
.now-k{
  display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  font-size:12px;font-weight:800;letter-spacing:.06em;
  background:rgba(255,255,255,.16);padding:4px 11px 4px 9px;border-radius:99px
}
.now-k i{width:8px;height:8px;border-radius:50%;background:#fff;animation:nowpulse 1.8s ease-out infinite}
@keyframes nowpulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}
  70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.hero .now-h{font-size:22px;line-height:1.3;margin-top:8px}
.now-also{font-size:12px;opacity:.82;margin-top:5px;line-height:1.5}
.now-where{
  margin-top:12px;padding-top:11px;border-top:1px dashed rgba(255,255,255,.28);
  font-size:13.5px;font-weight:700;line-height:1.55
}
.now-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.now-strip span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.13);opacity:.85}
.now-strip span b{font-weight:800;margin-right:5px;opacity:.75}
.now-strip span.cur{background:#fff;color:var(--reg-shade);opacity:1;font-weight:800}
.now-strip span.past{opacity:.45;text-decoration:line-through}

.nxlist{padding-top:6px;padding-bottom:6px}
.nx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.nx:first-child{border-top:0}
.nx-t{flex:none;min-width:54px;font-family:var(--display);font-size:12px;color:var(--reg);font-variant-numeric:tabular-nums}
.nx-b{flex:1;min-width:0;font-size:14.5px;font-weight:800;line-height:1.4}
.nx-b small{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px}
.nx-go{
  flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--reg-tint);color:var(--reg)
}
.nx-go svg{width:17px;height:17px}

.part-w{font-size:12.5px;color:var(--ink3);font-weight:600}
.ev.now{border-color:var(--reg);box-shadow:0 0 0 3px var(--reg-tint),var(--sh-1)}
.ev.now::before{width:12px;height:12px;left:-21px;top:16px;box-shadow:0 0 0 3px var(--paper),0 0 0 7px var(--reg-tint)}
.ev-now{
  float:right;margin:0 0 4px 8px;font-size:11px;font-weight:800;color:#fff;
  background:var(--reg);padding:2px 9px;border-radius:99px
}
.ev.past{opacity:.55}
.ev.past::before{background:var(--line2)}

/* ---------- 進度 ---------- */
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog-row b{font-size:14.5px}
.prog-row span{font-family:var(--display);font-size:12px;color:var(--ink3)}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1)}
.card-p{padding:14px 16px}

/* ---------- 日卡（印章頁） ---------- */
.daycard{
  display:block;border-radius:18px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)
}
.daycard.now{border-color:var(--reg);box-shadow:0 0 0 3px var(--reg-tint),var(--sh-2)}
.daycard:active{transform:scale(.994)}
.daycard{transition:transform .12s ease}
.dc-art{aspect-ratio:400/112;position:relative;background:var(--sky)}
.dc-badge{
  position:absolute;left:12px;top:12px;width:42px;height:42px;border-radius:50%;
  background:var(--card);color:var(--reg);display:grid;place-items:center;
  font-family:var(--display);font-size:18px;box-shadow:0 0 0 2.5px var(--reg)
}
.dc-flag{
  position:absolute;right:0;bottom:0;background:var(--reg);color:#fff;
  font-size:11px;font-weight:700;padding:4px 11px;border-radius:11px 0 0 0;letter-spacing:.02em
}
.dc-body{padding:12px 15px 13px}
.dc-date{font-family:var(--display);font-size:11.5px;color:var(--ink3);letter-spacing:.07em}
.dc-title{font-size:16px;font-weight:800;margin-top:3px}
.dc-region{font-size:12.5px;color:var(--reg);font-weight:700;margin-top:3px}
.dc-foot{
  display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2);
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)
}
.dc-foot svg{width:15px;height:15px;flex:none;color:var(--ink3)}

/* ---------- 時間軸 ---------- */
.part{margin-top:18px}
.part-h{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--reg)}
.part-h svg{width:17px;height:17px;flex:none}
.part-h b{font-size:13.5px;font-weight:800}
.part-h .pill{
  margin-left:auto;font-family:var(--display);font-size:10.5px;padding:2px 9px;border-radius:99px;
  background:var(--reg-tint);color:var(--reg)
}
.tl{position:relative;padding-left:21px}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--reg);opacity:.3;border-radius:2px}
.ev{position:relative;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1)}
.ev+.ev{margin-top:10px}
.ev::before{content:"";position:absolute;left:-20px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--reg);box-shadow:0 0 0 3px var(--paper)}
.ev-time{font-family:var(--display);font-size:11.5px;color:var(--reg);letter-spacing:.04em}
.ev-title{font-size:15.5px;font-weight:800;margin-top:2px}
.ev-desc{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.65}
.ev-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:7px;background:var(--reg-tint);color:var(--reg);margin-top:7px
}
.ev-tag svg{width:13px;height:13px}

/* ---------- 按鈕 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-right:7px;
  font-size:12.5px;font-weight:700;color:var(--reg);
  border:1.5px solid color-mix(in srgb, var(--reg) 38%, transparent);
  background:var(--reg-tint);padding:7px 12px;border-radius:10px
}
.btn svg{width:15px;height:15px;flex:none}
.btn:active{background:color-mix(in srgb, var(--reg) 26%, var(--card))}

/* ---------- 提示 ---------- */
.alert{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.65;border:1px solid;display:flex;gap:10px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.alert b{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;margin-bottom:3px}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.alert.danger{background:var(--dgr-soft);border-color:var(--dgr-line);color:var(--dgr)}
.alert.info{background:var(--ok-soft);border-color:color-mix(in srgb, var(--ok) 32%, transparent);color:var(--ok)}

.drive{
  display:flex;gap:10px;align-items:flex-start;font-size:13px;
  background:var(--sunk);border:1px dashed var(--line2);border-radius:14px;padding:11px 14px;color:var(--ink2)
}
.drive svg{width:17px;height:17px;flex:none;color:var(--reg);margin-top:2px}

/* ---------- 勾選清單 ---------- */
.grp{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--card2);border-bottom:1px solid var(--line)}
.grp-h .gi{font-size:19px;line-height:1}
.grp-h b{flex:1;font-size:14.5px;font-weight:800}
.grp-h .cnt{font-family:var(--display);font-size:11.5px;color:var(--ink3)}
.grp-note{font-size:12.5px;padding:10px 15px;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);line-height:1.6}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;cursor:pointer;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{
  appearance:none;-webkit-appearance:none;flex:none;margin:2px 0 0;
  width:22px;height:22px;border-radius:8px;border:2px solid var(--line2);background:var(--sunk);cursor:pointer
}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked::after{content:"✓";display:block;color:#fff;font-size:14px;font-weight:900;text-align:center;line-height:18px}
.chk-b{min-width:0;flex:1;display:block}
.chk-t{display:block;font-size:14.5px;font-weight:700}
.chk-d{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.55}
.chk input:checked~.chk-b .chk-t{text-decoration:line-through;color:var(--ink3);font-weight:500}

/* 自己要帶的 */
.mine-row{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.grp-h+.mine-row{border-top:0}
.mine-row .chk{flex:1;border-top:0;min-width:0}
.mine-del{
  flex:none;width:46px;border:0;background:none;color:var(--ink3);
  font-size:20px;line-height:1;cursor:pointer
}
.mine-del:active{color:var(--dgr)}
.mine-add{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line);background:var(--card2)}
.grp-h+.mine-add{border-top:0}
.mine-add input{
  flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)
}
.mine-add input:focus{outline:2px solid var(--ok);outline-offset:0;border-color:transparent}
.mine-add button{
  flex:none;font:inherit;font-size:14px;font-weight:800;padding:0 16px;border-radius:12px;
  border:0;background:var(--ok);color:#fff;cursor:pointer
}
.chk .star{color:var(--brand)}
.chk-by{font-weight:800;color:var(--brand)}

/* ---------- 手風琴 ---------- */
details.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);overflow:hidden}
details.acc+details.acc{margin-top:10px}
details.acc>summary{list-style:none;cursor:pointer;padding:11px 15px;display:flex;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-size:15px;font-weight:800}
.acc-t span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
details.acc>summary .caret{flex:none;color:var(--ink3);font-size:14px;transition:transform .2s}
details.acc[open]>summary .caret{transform:rotate(180deg)}
.acc-body{padding:0 15px 15px;border-top:1px solid var(--line);padding-top:13px}
.acc-ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.acc-ic svg{width:20px;height:20px}

/* ---------- 清單 ---------- */
.ilist{margin:0;padding:0;list-style:none}
.ilist li{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.65}
.ilist li:first-child{border-top:0;padding-top:1px}
.ilist .n{font-weight:800;font-size:14px}
.ilist .d{color:var(--ink2);font-size:12.5px;margin-top:2px}
.sub-h{
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--reg,var(--brand));
  margin:16px 0 6px;display:flex;align-items:center;gap:8px
}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sub-h:first-child{margin-top:0}

/* ---------- 定義列表 ---------- */
dl{margin:0}
.kv{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv dt{flex:none;width:70px;color:var(--ink3);font-size:12.5px;font-weight:700}
.kv dd{margin:0;flex:1;min-width:0}

/* ---------- 航班 ---------- */
.fl{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.fl:first-child{border-top:0;padding-top:2px}
.fl-code{flex:none;width:62px}
.fl-code b{font-family:var(--display);font-size:14px;display:block}
.fl-code span{font-size:10.5px;color:var(--ink3);display:block;margin-top:1px}
.fl-rt{display:flex;align-items:center;gap:9px}
.fl-rt .t{font-family:var(--display);font-size:16px}
.fl-rt .a{font-size:10.5px;color:var(--ink3);margin-top:1px}
.fl-rt .arrow{flex:1;height:1.5px;background:var(--line2);position:relative;min-width:20px;border-radius:2px}
.fl-rt .arrow svg{position:absolute;right:-4px;top:-8px;width:15px;height:15px;color:var(--ink3)}
.fl-when{font-size:11px;color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:7px;font-family:var(--display)}
.whopill{font-family:var(--body);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}

/* ---------- 飯店 ---------- */
.hotel{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-1)}
.hotel-art{aspect-ratio:400/94;background:var(--sky)}
.hotel-b{padding:13px 15px 14px}
.hotel-b .nights{font-family:var(--display);font-size:11px;color:var(--ink3);letter-spacing:.07em}
.hotel-b h3{font-size:16.5px;margin-top:3px}
.hotel-b .en{font-size:11.5px;color:var(--ink3);margin-top:1px;letter-spacing:.02em}

/* ---------- 日文短句 ---------- */
.ph{padding:11px 0;border-top:1px solid var(--line)}
.ph:first-child{border-top:0;padding-top:1px}
.ph .jp{font-size:16px;font-weight:700}
.ph .tw{font-size:13px;color:var(--ink2);margin-top:2px}
.ph .rm{font-size:11.5px;color:var(--ink3);font-style:italic;margin-top:1px}

/* ---------- 換算 ---------- */
.conv{display:flex;align-items:center;gap:10px;margin-top:11px}
.conv input{
  flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:17px;padding:10px 13px;
  border-radius:11px;border:1.5px solid var(--line2);background:var(--sunk);color:var(--ink)
}
.conv .eq{color:var(--ink3);flex:none;font-weight:800}
.conv .out{flex:1;font-family:var(--display);font-size:17px;text-align:right;color:var(--ok)}
.rate-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);margin-top:10px}
.rate-row input{
  width:76px;font:inherit;font-family:var(--display);font-size:13px;padding:6px 9px;border-radius:9px;
  border:1px solid var(--line);background:var(--sunk);color:var(--ink);text-align:right
}

/* ---------- 費用 ---------- */
.total-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.total-row:first-child{border-top:0}
.total-row .money{font-family:var(--display);font-size:14px;white-space:nowrap}
.total-row.grand{border-top:2px solid var(--line2);margin-top:2px;font-size:15px;font-weight:800}
.total-row.grand .money{font-size:17px;color:var(--brand)}

/* ---------- 其他 ---------- */
.money{font-family:var(--display)}
.muted{color:var(--ink3);font-size:12px;line-height:1.65}
.warnpill{display:block;font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:9px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);margin-top:9px;line-height:1.55}
.tel{color:var(--brand);font-weight:800}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--brand);margin-bottom:13px}
.day-nav{display:flex;gap:10px;margin-top:22px}
.day-nav a{
  flex:1;padding:12px;text-align:center;border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-size:13px;font-weight:800;box-shadow:var(--sh-1)
}
.day-nav a.dis{opacity:.32;pointer-events:none}
.day-nav a.wide{flex:1;background:var(--reg);color:#fff;border-color:var(--reg)}

/* ============ 密碼門檻 ============ */
#gate{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;
  background:var(--paper)
}
.gate-card{
  width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:28px 22px 22px;box-shadow:var(--sh-2);text-align:center
}
.gate-mark{width:44px;height:44px;margin:0 auto 12px;color:var(--brand)}
.gate-mark svg{width:100%;height:100%}
.gate-card h2{font-size:20px;margin:0 0 4px;letter-spacing:.02em}
.gate-sub{margin:0 0 20px;color:var(--ink3);font-size:13px}
.gate-card label,.af{display:block;text-align:left;margin-bottom:12px}
.gate-card label span,.af>span{
  display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;letter-spacing:.02em
}
.gate-card input,.af input,.af textarea,.af select{
  width:100%;box-sizing:border-box;font:inherit;font-size:15px;color:var(--ink);
  background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px
}
.af textarea{resize:vertical;line-height:1.5}
.gate-card input:focus,.af input:focus,.af textarea:focus,.af select:focus{
  outline:2px solid var(--brand);outline-offset:-1px;background:var(--card)
}
.btn-primary{
  width:100%;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
  background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px;margin-top:4px
}
.btn-primary:active{filter:brightness(.93)}
.btn-primary:disabled{opacity:.5;cursor:default}
.gate-msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--dgr)}

/* ============ 後台 ============ */
.a-lock{max-width:340px;margin:32px auto;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:24px 20px}
.a-lock h2{margin:0 0 8px;font-size:18px}
.a-lock p{margin:0 0 16px;font-size:13px;color:var(--ink2);line-height:1.6}
.a-tabs,.a-daypick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.a-tabs::-webkit-scrollbar,.a-daypick::-webkit-scrollbar{display:none}
.a-chip{
  flex:none;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
  background:var(--card);color:var(--ink2);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px
}
.a-chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.a-sec{margin-bottom:20px}
.a-sec h3{
  display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.08em;
  color:var(--ink3);margin:18px 0 8px;text-transform:uppercase
}
.a-sec h4{font-size:12px;color:var(--ink3);margin:14px 0 6px;letter-spacing:.06em}
.a-count{background:var(--sunk);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink2)}
.a-card,.a-row{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 14px 4px;margin-bottom:10px
}
.a-row{position:relative;padding-top:38px}

/* 旅遊助手 — vanilla JS，無外部依賴（Google Fonts 失效時自動退回系統字型）。
   引擎與行程資料分離：這支只認 data/site.js 的行程索引，內容在 trips/<id>/ 底下。 */
(function () {
  'use strict';

  /* ---------- 儲存命名空間 ----------
     全域（跨行程共用）：hz:theme / hz:gate / hz:lastTrip / hz:ghtoken / hz:site
     每趟行程：hz:<tripId>:state（打包勾選、匯率）、hz:<tripId>:data（後台草稿）
     舊版的 kyushu2026:* 開機時自動搬過來，搬完保留舊 key 當回退保險。 */
  var NS = 'hz:';

      lsSet(NS + 'kyushu-2026:state', JSON.stringify({ checks: old.checks || {}, rate: old.rate, mine: old.mine || [] }));
      if (old.theme) lsSet(NS + 'theme', old.theme);

    [['kyushu2026:data', 'kyushu-2026:data'], ['kyushu2026:gate', 'gate'], ['kyushu2026:ghtoken', 'ghtoken']]
      .forEach(function (p) { var v = lsGet(p[0]); if (v && !lsGet(NS + p[1])) lsSet(NS + p[1], v); });

  /* ---------- 資料覆寫層（每趟一份） ----------

    TODOS = window.TODOS || [];
    PLACES = window.PLACES || { updated: '', regions: {}, unassigned: [] };

  function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
  function fmtMD(s) { var a = s.split('-'); return (+a[1]) + '/' + (+a[2]); }
  function I(name) { return ART.icons[name] || ''; }
  function regOf(n) { return (TRIP.dayRegion && TRIP.dayRegion[n]) || defaultReg(); }

  /* ---------- 地區：色盤與插畫都從 TRIP.regions 來 ----------
     以前同一組地區 id 散在 app.css、art.js、admin.js 各一份，改成只有這裡一份。 */
  function regionOf(id) {
    var rs = (TRIP && TRIP.regions) || [];
    for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
    return null;
  }
  function defaultReg() {
    var rs = (TRIP && TRIP.regions) || [];
    return regionOf('journey') ? 'journey' : (rs[0] ? rs[0].id : 'journey');
  }
  function artKey(id) { var r = regionOf(id); return (r && r.art) || ART.fallback; }
  function scene(reg) { return ART.svg(artKey(reg)); }
  function stamp(reg) {
    return '<span class="stamp" data-reg="' + esc(reg) + '">'
      + ART.svg(artKey(reg), 'scene', 'xMidYMid slice') + '</span>';

  var PAL_KEYS = ['rb', 'sky', 'far', 'mid', 'near', 'pop', 'pale'];
  function injectPalette() {
    var el = document.getElementById('hz-palette');
    if (!el) { el = document.createElement('style'); el.id = 'hz-palette'; document.head.appendChild(el); }
    el.textContent = ((TRIP && TRIP.regions) || []).map(function (r) {
      var p = r.palette || {};
      return '[data-reg="' + r.id + '"]{' + PAL_KEYS.map(function (k) {
        return (k === 'rb' ? '--rb:' : '--c-' + k + ':') + (p[k] || '#8a8a8a');
      }).join(';') + '}';
    }).join('\n');
  }

  var PART = { am: ['上午', 'sun'], pm: ['下午', 'cloud'], night: ['晚上', 'moon'] };

  /* ---------- theme ---------- */
  function applyTheme() {
    if (theme) document.documentElement.setAttribute('data-theme', theme);

  applyTheme();
  document.getElementById('theme-btn').addEventListener('click', function () {
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
    if (!theme) theme = sysDark ? 'light' : 'dark';

  });

  /* ---------- 現在進行到哪 ----------
     把當天每一項排上時間軸：有寫時間的照寫的，沒寫的平均塞進前後兩個有寫的時間之間
     （上午從 9:00、下午從 12:00、晚上從 18:00 算起，晚上排到 22:00）。
     每一項的結束時間＝寫明的結束時間，沒寫就算到下一項開始。 */
  var PART_WIN = { am: [540, 720], pm: [720, 1080], night: [1080, 1320] };
  var PART_ORD = ['am', 'pm', 'night'];
  function hmOf(s) { var m = /(\d{1,2}):(\d{2})/.exec(s); return m ? (+m[1]) * 60 + (+m[2]) : null; }
  function hhmm(m) { m = Math.round(m); return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2); }
  function clip(s, n) { s = s || ''; return s.length > n ? s.slice(0, n) + '…' : s; }
  function spanOf(t) {
    t = (t || '').trim();
    var all = t.match(/\d{1,2}:\d{2}/g) || [];
    if (all.length >= 2) return [hmOf(all[0]), hmOf(all[1])];
    if (all.length === 1) return /^[～~]/.test(t) ? [null, hmOf(all[0])] : [hmOf(all[0]), null];
    if (/午餐/.test(t)) return [720, null];
    if (/晚餐/.test(t)) return [1080, null];
    return [null, null];
  }
  function dayTimeline(day) {
    var tl = [];
    day.blocks.forEach(function (b) {
      var w = PART_WIN[b.part] || [0, 1440];
      var its = b.items.map(function (it) { var sp = spanOf(it.time); return { it: it, part: b.part, s: sp[0], e: sp[1], est: sp[0] == null, w: w }; });
      var i = 0, j, k, cnt, from, to, step;
      while (i < its.length) {
        if (its[i].s != null) { i++; continue; }
        j = i; while (j < its.length && its[j].s == null) j++;
        cnt = j - i;
        to = j < its.length ? its[j].s : w[1];
        if (i === 0) { from = w[0]; step = (to - from) / cnt; for (k = 0; k < cnt; k++) its[i + k].s = from + step * k; }
        else if (its[i - 1].e != null) { from = its[i - 1].e; step = (to - from) / cnt; for (k = 0; k < cnt; k++) its[i + k].s = from + step * k; }
        else { from = its[i - 1].s; step = (to - from) / (cnt + 1); for (k = 0; k < cnt; k++) its[i + k].s = from + step * (k + 1); }
        i = j;
      }
      its.forEach(function (x) { if (x.est) x.s = Math.round(x.s / 5) * 5; tl.push(x); });
    });
    tl.forEach(function (x, i) {
      var nx = tl[i + 1];
      x.end = x.e != null ? x.e : (nx && nx.s > x.s ? nx.s : x.w[1]);
      if (x.end <= x.s) x.end = x.s + 30;

    return tl;
  }
  function nowStatus(day, mins) {

      else if (x.s > mins && !next) next = x;

  }
  function isTodayDay(day) {

  }
  /* 航班：從標籤裡抓航班號與是哪一團，例如「虎航 IT240・小阿姨團 4 人」 */
  function flightOf(it) {
    var m = /\b(BR|IT|CI|JX|MM|GK)\s?\d{2,4}\b/.exec((it.tag || '') + ' ' + (it.title || ''));
    if (!m) return null;
    var parts = (it.tag || '').split('・');
    return { code: m[0], air: (parts[0] || '').replace(m[0], '').trim(), who: (parts[1] || '').trim() };
  }
  function partNow(st) { return st.cur ? st.cur.part : st.next ? st.next.part : 'night'; }

  function whereHtml(day, part) {
    var bs = day.blocks.filter(function (b) { return b.items.length && b.where; });
    if (!bs.length) return '';
    var pi = PART_ORD.indexOf(part), curB = null, line = '', i;
    for (i = 0; i < bs.length; i++) if (bs[i].part === part) curB = bs[i];
    if (curB) {
      if (bs.every(function (b) { return b.where === curB.where; })) line = '今天都在' + curB.where;
      else {
        /* 「A → B」這種是一段移動，不一定此刻就在路上，所以不說「現在在」 */
        var moving = /→/.test(curB.where), dest = curB.where.split('→').pop().trim();
        line = moving ? PART[curB.part][0] + '這段：' + curB.where : '現在在' + curB.where;
        for (i = 0; i < bs.length; i++) {
          var b = bs[i];
          if (PART_ORD.indexOf(b.part) <= pi || b.where === curB.where) continue;
          /* 下一段就是剛才的目的地（例如「長崎 → 熊本」之後的「熊本」），不用再講一次 */
          if (!/→/.test(b.where) && b.where.indexOf(dest) === 0) break;
          line += /→/.test(b.where) ? '，' + PART[b.part][0] + '移動：' + b.where
                                     : '，' + PART[b.part][0] + '往' + b.where + '出發';
          break;
        }
      }
    }
    /* 動線小籤：連續同一個地方就合併 */
    var groups = [];
    bs.forEach(function (b) {
      var g = groups[groups.length - 1];
      if (g && g.where === b.where) g.parts.push(b.part); else groups.push({ where: b.where, parts: [b.part] });
    });
    var strip = groups.length < 2 ? '' : '<div class="now-strip">' + groups.map(function (g) {
      var idx = g.parts.map(function (p) { return PART_ORD.indexOf(p); });
      var cls = idx.indexOf(pi) >= 0 ? 'cur' : (Math.max.apply(null, idx) < pi ? 'past' : '');
      var lb = g.parts.length === 3 ? '全天' : g.parts.map(function (p) { return PART[p][0]; }).join('・');
      return '<span' + (cls ? ' class="' + cls + '"' : '') + '><b>' + lb + '</b>' + esc(g.where) + '</span>';
    }).join('') + '</div>';
    return (line ? '<div class="now-where">' + esc(line) + '</div>' : '') + strip;
  }

  function nowHeroHtml(day, st, hotel) {

      } else {

        if (st.cur.it.desc) sub += (sub ? '　' : '') + clip(st.cur.it.desc, 40);
      }
    } else if (st.next) {
      k = st.next === st.tl[0] ? '今天第一站' : '下一站';
      f = flightOf(st.next.it);
      if (f) {
        h2 = (f.who ? f.who + ' ' : '') + '準備搭機 ✈';
        sub = st.next.it.title + '　' + (f.air ? f.air + ' ' : '') + f.code + '，' + hhmm(st.next.s) + ' 起飛';
      } else {
        h2 = st.next.it.title;
        sub = (st.next.est ? '大約 ' : '') + hhmm(st.next.s) + ' 開始';
      }
    } else {
      k = '今天行程結束';
      h2 = hotel ? '回 ' + hotel.name + ' 休息' : '一路平安，歡迎回家';
      sub = hotel ? (hotel.access || hotel.addr || '') : '';
    }
    var also = st.also.length ? '<div class="now-also">同一時間：' + st.also.map(function (x) {
      var g = flightOf(x.it); return esc(g && g.who ? g.who + '　' + x.it.title : x.it.title);
    }).join('、') + '</div>' : '';
    return '<div class="now-k"><i></i>' + esc(k) + '</div>'
      + '<h2 class="now-h">' + esc(h2) + '</h2>'
      + (sub ? '<div class="meta">' + esc(sub) + '</div>' : '')
      + also
      + whereHtml(day, partNow(st));
  }

  function nextCardHtml(st) {
    var up = st.tl.filter(function (x) { return x.s > st.mins; });
    if (!st.cur) up = up.slice(1);          /* 沒有進行中的時候，第一項已經在上面大字顯示了 */
    up = up.slice(0, 3);
    if (!up.length) return '';
    return '<div class="sec-title">接下來</div><div class="card card-p nxlist">' + up.map(function (x) {
      var f = flightOf(x.it);
      return '<div class="nx"><div class="nx-t">' + (x.est ? '約 ' : '') + hhmm(x.s) + '</div>'
        + '<div class="nx-b">' + esc(x.it.title)
        + '<small>' + esc(f && f.who ? f.who + '・' + f.code : PART[x.part][0] + (x.it.desc ? '・' + clip(x.it.desc, 22) : '')) + '</small></div>'
        + (x.it.map ? '<a class="nx-go" target="_blank" rel="noopener" href="' + esc(mapUrl(x.it.map)) + '" aria-label="導航到 ' + esc(x.it.title) + '">' + I('nav') + '</a>' : '')
        + '</div>';
    }).join('') + '</div>';
  }

  /* ---------- fragments ---------- */
  function hotelOf(key) {
    if (!key) return null;
    for (var i = 0; i < TRIP.hotels.length; i++) if (TRIP.hotels[i].key === key) return TRIP.hotels[i];
    return null;
  }
  function alertsHtml(list) {
    if (!list || !list.length) return '';
    var LB = { warn: '注意', danger: '重要', info: '提醒' };
    return list.map(function (a) {
      return '<div class="alert ' + a.level + '">' + I('alert')
        + '<div><b>' + esc(LB[a.level] || '提醒') + '</b>' + md(a.text) + '</div></div>';
    }).join('');
  }
  function navBtn(q, label) {
    return '<a class="btn" target="_blank" rel="noopener" href="' + esc(mapUrl(q)) + '">'
      + I('nav') + (label || '導航 · ' + esc(q)) + '</a>';
  }
  function eventHtml(it, cls) {
    var h = '<div class="ev' + (cls ? ' ' + cls : '') + '">';
    if (cls === 'now') h += '<span class="ev-now">進行中</span>';
    if (it.time) h += '<div class="ev-time">' + esc(it.time) + '</div>';
    h += '<div class="ev-title">' + esc(it.title) + '</div>';
    if (it.desc) h += '<div class="ev-desc">' + esc(it.desc) + '</div>';
    if (it.tag) h += '<div><span class="ev-tag">' + I('plane') + esc(it.tag) + '</span></div>';
    if (it.map) h += navBtn(it.map);
    return h + '</div>';
  }
  function blocksHtml(day) {
    /* 今天的話，標出「進行中」和已經過去的項目 */
    var st = isTodayDay(day) ? nowStatus(day, nowMins()) : null;
    function cls(it) {
      if (!st) return '';
      if ((st.cur && st.cur.it === it) || st.also.some(function (x) { return x.it === it; })) return 'now';
      for (var i = 0; i < st.tl.length; i++) if (st.tl[i].it === it) return st.tl[i].end <= st.mins ? 'past' : '';
      return '';
    }
    return day.blocks.map(function (b) {
      if (!b.items.length) return '';
      var pt = PART[b.part];
      return '<div class="part"><div class="part-h">' + I(pt[1]) + '<b>' + pt[0] + '</b>'
        + (b.where ? '<span class="part-w">' + esc(b.where) + '</span>' : '')
        + '<span class="pill">' + b.items.length + '</span></div>'
        + '<div class="tl">' + b.items.map(function (it) { return eventHtml(it, cls(it)); }).join('') + '</div></div>';
    }).join('');
  }
  function hotelCard(h, heading) {
    if (!h) return '';
    var reg = h.art || 'journey';
    var body = '<dl>';
    body += '<div class="kv"><dt>房型</dt><dd>' + esc(h.rooms || '—') + '</dd></div>';
    if (h.access) body += '<div class="kv"><dt>位置</dt><dd>' + esc(h.access) + '</dd></div>';
    if (h.addr) body += '<div class="kv"><dt>地址</dt><dd>' + esc(h.addr) + '</dd></div>';
    if (h.tel) body += '<div class="kv"><dt>電話</dt><dd><a class="tel" href="tel:' + esc(h.tel.replace(/-/g, '')) + '">' + esc(h.tel) + '</a></dd></div>';
    body += '</dl>';
    return (heading ? '<div class="sec-title">' + esc(heading) + '</div>' : '')
      + '<div class="hotel" data-reg="' + esc(reg) + '">'
      + '<div class="hotel-art">' + scene(reg) + '</div>'
      + '<div class="hotel-b">'
      + '<div class="nights">' + esc(h.nights) + '</div>'
      + '<h3>' + esc(h.name) + '</h3>'
      + (h.en ? '<div class="en">' + esc(h.en) + '</div>' : '')
      + body
      + (h.warn ? '<div class="warnpill">⚠︎ ' + esc(h.warn) + '</div>' : '')
      + navBtn(h.map, '地圖・照片')
      + (h.site ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(h.site) + '">' + I('photo') + '官方網站</a>' : '')
      + '</div></div>';
  }

  function allPackIds() {
    var ids = [];
    PACKING.forEach(function (g) { g.items.forEach(function (i) { ids.push('p:' + g.id + ':' + i.id); }); });
    state.mine.forEach(function (x) { ids.push('m:' + x.id); });
    return ids;
  }
  function doneCount(ids) { var n = 0; ids.forEach(function (i) { if (state.checks[i]) n++; }); return n; }

  function regionForDay(n) {
    var id = regOf(n);
    for (var i = 0; i < GUIDE.regions.length; i++) if (GUIDE.regions[i].id === id) return GUIDE.regions[i];
    return null;
  }
  /* 從 Google 地圖收藏匯入的地點（tools/import-places.js 產生）。沒匯入就整段不顯示。 */
  function placesOf(id) { return (PLACES.regions && PLACES.regions[id]) || []; }
  function placeListHtml(list) {
    return '<ul class="ilist">' + list.map(function (x) {
      return '<li><div class="n">' + esc(x.n) + '</div>'
        + (x.d ? '<div class="d">' + esc(x.d) + '</div>' : '')
        + (x.map ? navBtn(x.map, '導航 · ' + esc(x.label || x.n)) : '')
        + '</li>';
    }).join('') + '</ul>';
  }
  function myPlacesHtml(id) {
    var list = placesOf(id);
    if (!list.length) return '';
    return '<div class="sub-h">我的收藏　<span class="pill">' + list.length + '</span></div>' + placeListHtml(list);
  }

  function regionEatHtml(n) {
    var r = regionForDay(n);
    if (!r) return '';
    return '<div class="sec-title">' + esc(r.name) + ' 吃什麼</div>'
      + '<div class="card card-p" data-reg="' + esc(r.id) + '"><ul class="ilist">'
      + r.eat.map(function (x) { return '<li><div class="n">' + esc(x.n) + '</div><div class="d">' + esc(x.d) + '</div></li>'; }).join('')
      + '</ul><div class="muted" style="margin-top:10px">一般建議，不是已排定的行程。</div></div>';
  }

  function dayCard(d, allowNow) {
    var t = today(), s = dateObj(TRIP.start);
    var isNow = allowNow !== false && dayDiff(s, t) === d.n - 1 && t >= s && t <= dateObj(TRIP.end);
    var hotel = hotelOf(d.hotel), reg = regOf(d.n);
    return '<a class="daycard' + (isNow ? ' now' : '') + '" data-reg="' + esc(reg) + '" href="' + hashFor('plan', d.n) + '">'
      + '<div class="dc-art">' + scene(reg)
      + '<div class="dc-badge">' + d.n + '</div>'
      + (isNow ? '<div class="dc-flag">今天</div>' : '') + '</div>'
      + '<div class="dc-body">'
      + '<div class="dc-date">' + fmtMD(d.date) + '　' + esc(d.dow) + '</div>'
      + '<div class="dc-title">' + esc(d.title) + '</div>'
      + '<div class="dc-region">' + esc(d.region) + '</div>'
      + '<div class="dc-foot">' + (hotel ? I('bed') + '<span>' + esc(hotel.name) + '</span>'
                                         : I('plane') + '<span>當晚搭機返台，無住宿</span>') + '</div>'
      + '</div></a>';
  }

  /* ---------- views ---------- */
  function viewToday() {
    var t = today(), s = dateObj(TRIP.start), e = dateObj(TRIP.end), h = '';

    if (t < s) {
      var left = dayDiff(t, s);
      var pIds = allPackIds(), pDone = doneCount(pIds);
      var tIds = TODOS.map(function (x) { return 't:' + x.id; }), tDone = doneCount(tIds);

      h += '<div class="hero" data-reg="journey"><div class="hero-art">' + scene('journey') + '</div>'
        + '<div class="hero-body"><div class="eyebrow">出發倒數</div>'
        + '<div class="big">' + left + '<small>天</small></div>'
        + '<h2>' + esc(TRIP.title) + '</h2>'
        + '<div class="meta">' + esc(TRIP.party) + '</div></div></div>';

      h += '<div class="sec-title">準備進度</div><div class="card card-p stack">'
        + '<div><div class="prog-row"><b>行前待辦</b><span>' + tDone + ' / ' + tIds.length + '</span></div>'
        + '<div class="prog"><i style="width:' + (tIds.length ? tDone / tIds.length * 100 : 0) + '%"></i></div></div>'
        + '<div><div class="prog-row"><b>行李打包</b><span>' + pDone + ' / ' + pIds.length + '</span></div>'
        + '<div class="prog"><i style="width:' + (pIds.length ? pDone / pIds.length * 100 : 0) + '%"></i></div></div>'
        + '</div>';

      h += '<div class="sec-title">行前待辦</div><div class="grp">'
        + TODOS.map(function (x) {
            var id = 't:' + x.id;
            return '<label class="chk"><input type="checkbox" data-k="' + esc(id) + '"' + (state.checks[id] ? ' checked' : '') + '>'
              + '<span class="chk-b"><span class="chk-t">' + esc(x.t) + '</span>'
              + '<span class="chk-d">' + esc(x.d) + '　<span class="chk-by">' + esc(x.by) + '</span></span></span></label>';
          }).join('')
        + '</div>';

      h += '<div class="sec-title">第一天</div>' + dayCard(TRIP.days[0], false);

    } else if (t > e) {
      h += '<div class="hero" data-reg="journey"><div class="hero-art">' + scene('journey') + '</div>'
        + '<div class="hero-body"><div class="eyebrow">旅程已結束</div>'
        + '<div class="big">' + TRIP.days.length + '<small>天</small></div>'
        + '<h2>' + esc(TRIP.title) + '</h2>'
        + '<div class="meta">' + esc(fmtRange(TRIP.start, TRIP.end)) + ' · 歡迎回家</div></div></div>'
        + '<div class="sec-title">全部行程</div><div class="stack">'
        + TRIP.days.map(function (d) { return dayCard(d, false); }).join('') + '</div>';

    } else {
      var idx = dayDiff(s, t), day = TRIP.days[idx], reg = regOf(day.n), hotel = hotelOf(day.hotel);

      var st = nowStatus(day, nowMins());

      /* 最上面跟著行程走：現在在做什麼、在哪裡、接下來往哪 */
      h += '<div class="hero" data-reg="' + esc(reg) + '"><div class="hero-art">' + scene(reg) + '</div>'
        + '<div class="hero-body"><div class="eyebrow">Day ' + day.n + ' · ' + fmtMD(day.date) + ' ' + esc(day.dow)
        + ' · ' + PART[partNow(st)][0] + ' ' + hhmm(st.mins) + '</div>'
        + nowHeroHtml(day, st, hotel)
        + '</div></div>';

      h += '<div data-reg="' + esc(reg) + '">';
      h += nextCardHtml(st);
      if (day.alerts) h += '<div class="stack" style="margin-top:12px">' + alertsHtml(day.alerts) + '</div>';
      if (day.drive) h += '<div class="drive" style="margin-top:12px">' + I('car') + '<span>' + esc(day.drive) + '</span></div>';
      h += blocksHtml(day) + '</div>';

      h += hotel ? hotelCard(hotel, '今晚住宿')
                 : '<div class="sec-title">住宿</div><div class="card card-p"><div class="muted">當晚搭機返台，無住宿。</div></div>';
      h += regionEatHtml(day.n);
      h += '<div class="day-nav" data-reg="' + esc(reg) + '"><a class="wide" href="' + hashFor('plan', day.n) + '">看今天完整行程 →</a></div>';
    }
    return h;
  }

  function viewPlan() {
    return '<div class="sec-title">9 天行程</div><div class="stack">'
      + TRIP.days.map(function (d) { return dayCard(d); }).join('') + '</div>'
      + (TRIP.planNote ? '<div class="card card-p" style="margin-top:18px"><div class="muted">'
        + esc(TRIP.planNote) + '</div></div>' : '');
  }

  /* 住宿概況：筆數由 hotels 算，晚數從 nights 字串裡的「N 晚」加總 */
  function hotelSummary() {
    var hs = TRIP.hotels || [];
    var nights = hs.reduce(function (sum, h) {
      var m = /(\d+)\s*晚/.exec(h.nights || '');
      return sum + (m ? Number(m[1]) : 0);
    }, 0);
    return hs.length + ' 筆訂房' + (nights ? '・' + nights + ' 晚' : '');
  }

  function viewDay(n) {
    var d = null, i;
    for (i = 0; i < TRIP.days.length; i++) if (TRIP.days[i].n === n) d = TRIP.days[i];
    if (!d) return '<p>找不到這一天。</p>';
    var hotel = hotelOf(d.hotel), reg = regOf(d.n);

    var h = '<a class="back" href="' + hashFor('plan') + '">‹ 全部行程</a>'
      + '<div class="hero" data-reg="' + esc(reg) + '"><div class="hero-art">' + scene(reg) + '</div>'
      + '<div class="hero-body"><div class="eyebrow">Day ' + d.n + ' · ' + esc(d.date.replace(/-/g, '/')) + ' ' + esc(d.dow) + '</div>'
      + '<h2 style="font-size:21px;margin-top:6px">' + esc(d.title) + '</h2>'
      + '<div class="meta">' + esc(d.region) + '</div></div></div>';

    h += '<div data-reg="' + esc(reg) + '">';
    if (d.alerts) h += '<div class="stack" style="margin-top:12px">' + alertsHtml(d.alerts) + '</div>';
    if (d.drive) h += '<div class="drive" style="margin-top:12px">' + I('car') + '<span>' + esc(d.drive) + '</span></div>';
    h += blocksHtml(d) + '</div>';

    h += hotel ? hotelCard(hotel, d.n === TRIP.days.length ? '住宿' : '今晚住宿')
               : '<div class="sec-title">住宿</div><div class="card card-p"><div class="muted">當晚搭機返台，無住宿。</div></div>';
    h += regionEatHtml(d.n);

    var prev = d.n > 1 ? hashFor('plan', d.n - 1) : null,
        next = d.n < TRIP.days.length ? hashFor('plan', d.n + 1) : null;
    h += '<div class="day-nav">'
      + '<a class="' + (prev ? '' : 'dis') + '" href="' + (prev || '#') + '">‹ Day ' + (d.n - 1) + '</a>'
      + '<a class="' + (next ? '' : 'dis') + '" href="' + (next || '#') + '">Day ' + (d.n + 1) + ' ›</a></div>';
    return h;
  }

  function viewPack() {
    var ids = allPackIds(), done = doneCount(ids);
    var h = '<div class="card card-p">'
      + '<div class="prog-row"><b>打包進度</b><span>' + done + ' / ' + ids.length + '</span></div>'
      + '<div class="prog"><i style="width:' + (ids.length ? done / ids.length * 100 : 0) + '%"></i></div>'
      + '<div class="muted" style="margin-top:10px">勾選狀態和自己加的項目都只存在這支手機的瀏覽器裡，不會同步給其他人。</div></div>';

    /* 自己要帶的：每個人各自輸入，存在自己手機 */
    var mi = state.mine.map(function (x) { return 'm:' + x.id; }), md = doneCount(mi);
    h += '<div class="grp mine" style="margin-top:12px">'
      + '<div class="grp-h"><span class="gi">🎒</span><b>我自己要帶的</b>'
      + '<span class="cnt">' + md + '/' + mi.length + '</span></div>'
      + state.mine.map(function (x) {
          var id = 'm:' + x.id;
          return '<div class="mine-row"><label class="chk"><input type="checkbox" data-k="' + esc(id) + '"' + (state.checks[id] ? ' checked' : '') + '>'
            + '<span class="chk-b"><span class="chk-t">' + esc(x.t) + '</span></span></label>'
            + '<button type="button" class="mine-del" data-del="' + esc(x.id) + '" aria-label="刪除「' + esc(x.t) + '」">×</button></div>';
        }).join('')
      + '<form class="mine-add" data-form="mine" autocomplete="off">'
      + '<input name="t" maxlength="60" enterkeyhint="done" placeholder="' + (state.mine.length ? '再加一項…' : '例如：隱形眼鏡藥水、行動電源') + '" aria-label="新增自己要帶的項目">'
      + '<button type="submit">新增</button></form></div>';

    h += '<div class="stack" style="margin-top:12px">' + PACKING.map(function (g) {
      var gi = g.items.map(function (i) { return 'p:' + g.id + ':' + i.id; }), gd = doneCount(gi);
      return '<div class="grp">'
        + '<div class="grp-h"><span class="gi">' + g.icon + '</span><b>' + esc(g.name) + '</b>'
        + '<span class="cnt">' + gd + '/' + gi.length + '</span></div>'
        + (g.note ? '<div class="grp-note">' + esc(g.note) + '</div>' : '')
        + g.items.map(function (i) {
            var id = 'p:' + g.id + ':' + i.id;
            return '<label class="chk"><input type="checkbox" data-k="' + esc(id) + '"' + (state.checks[id] ? ' checked' : '') + '>'
              + '<span class="chk-b"><span class="chk-t">' + (i.critical ? '<span class="star">★ </span>' : '') + esc(i.t) + '</span>'
              + (i.d ? '<span class="chk-d">' + esc(i.d) + '</span>' : '') + '</span></label>';
          }).join('')
        + '</div>';
    }).join('') + '</div>';
    return h;
  }

  var PRACT_IC = { drive: 'car', onsen: 'onsen', money: 'yen', weather: 'sun', emergency: 'alert' };

  function viewGuide() {
    var gr = (GUIDE && GUIDE.regions) || [], gp = (GUIDE && GUIDE.practical) || [], gf = (GUIDE && GUIDE.phrases) || [];
    var h = gr.length ? '<div class="sec-title">各區美食與景點</div><div class="stack">' : '';
    h += gr.map(function (r) {
      return '<details class="acc" data-reg="' + esc(r.id) + '"><summary>'
        + stamp(r.id)
        + '<span class="acc-t"><b>' + esc(r.name) + '</b><span>' + esc(r.days) + '</span></span>'
        + '<span class="caret">⌄</span></summary><div class="acc-body">'
        + '<div class="sub-h">吃什麼</div><ul class="ilist">'
        + (r.eat || []).map(function (x) { return '<li><div class="n">' + esc(x.n) + '</div><div class="d">' + esc(x.d) + '</div></li>'; }).join('')
        + '</ul><div class="sub-h">看什麼</div><ul class="ilist">'
        + (r.see || []).map(function (x) { return '<li><div class="n">' + esc(x.n) + '</div><div class="d">' + esc(x.d) + '</div></li>'; }).join('')
        + '</ul>'
        + myPlacesHtml(r.id)
        + (r.tips && r.tips.length ? '<div class="sub-h">小提醒</div><ul class="ilist">'
            + r.tips.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '')
        + '</div></details>';
    }).join('') + (gr.length ? '</div>' : '');

    /* 匯入時判斷不出區域的收藏，獨立列出，避免資料靜靜消失 */
    if (PLACES.unassigned && PLACES.unassigned.length) {
      h += '<div class="sec-title">我的收藏・未分區</div><div class="card card-p">'
        + placeListHtml(PLACES.unassigned)
        + '<div class="muted" style="margin-top:10px">這些地點離各區錨點較遠或缺座標，沒有自動歸區。</div></div>';
    }
    if (PLACES.updated) {
      h += '<div class="muted" style="margin-top:10px">收藏地點匯入日期：' + esc(PLACES.updated) + '</div>';
    }

    if (gp.length) h += '<div class="sec-title">實用資訊</div><div class="stack">';
    h += gp.map(function (pr) {
      return '<details class="acc"><summary>'
        + '<span class="acc-ic">' + I(PRACT_IC[pr.id] || 'info') + '</span>'
        + '<span class="acc-t"><b>' + esc(pr.title) + '</b></span>'
        + '<span class="caret">⌄</span></summary>'
        + '<div class="acc-body"><ul class="ilist">'
        + pr.items.map(function (x) { return '<li>' + md(x) + '</li>'; }).join('')
        + '</ul></div></details>';
    }).join('') + (gp.length ? '</div>' : '');

    if (gf.length) h += '<div class="sec-title">' + esc(GUIDE.phrasesTitle || '常用會話') + '</div><div class="stack">';
    h += gf.map(function (g) {
      return '<details class="acc"><summary>'
        + '<span class="acc-ic">' + I('guide') + '</span>'
        + '<span class="acc-t"><b>' + esc(g.g) + '</b></span>'
        + '<span class="caret">⌄</span></summary><div class="acc-body">'
        + g.list.map(function (x) {

      + '本頁的景點與美食為一般旅遊建議，不是已排定的行程；營業時間、價格與活動舉辦與否請以官方即時公告為準。</div></div>';
    return h;

    }

    h += '<div class="sec-title">日幣換算</div><div class="card card-p">'
      + '<div class="conv"><input id="jpy-in" type="number" inputmode="decimal" value="10000" aria-label="日圓金額">'
      + '<span class="eq">≈</span><div class="out" id="twd-out">—</div></div>'
      + '<div class="rate-row"><span>匯率　1 JPY =</span><input id="rate-in" type="number" inputmode="decimal" step="0.001" value="' + state.rate + '" aria-label="匯率"><span>TWD</span></div>'
      + '<div class="muted" style="margin-top:10px">匯率是離線手動設定值，出發前請自行更新為當日匯率。</div></div>';

    if (TRIP.party) h += '<div class="sec-title">同行成員</div><div class="card card-p"><div style="font-size:13.5px">' + esc(TRIP.party) + '</div></div>';

    if (TRIP.source) h += '<div class="card card-p" style="margin-top:18px"><div class="muted">' + esc(TRIP.source) + '</div></div>';

    var who = gateSession();
    h += '<div class="owner-row">'
      + (who && who.name ? '<span>' + esc(who.name) + '，行程有變動請在後台改。</span>' : '<span></span>')
      + ((SITE.trips || []).length > 1 ? '<a href="#/trips">切換行程</a>' : '')
      + '<a href="#/admin">後台管理</a></div>';
