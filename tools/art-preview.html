<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市印象插畫 — 校稿板</title>
<script>var T=Date.now();document.write('<link rel="stylesheet" href="../app.css?t='+T+'">');</script>
<style>
  body{padding:12px}
  .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .box{border-radius:14px;overflow:hidden;box-shadow:var(--sh-1);background:var(--card)}
  .box .art{aspect-ratio:400/132}
  [data-art]{--sky:var(--c-sky);--far:var(--c-far);--mid:var(--c-mid);--near:var(--c-near);--pop:var(--c-pop);--pale:var(--c-pale);--reg:var(--rb)}
  .cap{display:flex;gap:6px;align-items:center;padding:5px 9px;font-size:11px;color:var(--ink2)}
  .cap b{color:var(--reg)}
  .sw{display:flex;gap:2px;margin-left:auto}
  .sw i{width:11px;height:11px;border-radius:2px;display:block}
  .small{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
</style></head><body>
<div class="wrap" id="host"></div>
<div class="small" id="stamps"></div>
<script>document.write('<script src="../data/art/_core.js?t='+T+'"><\/script>');</script>
<script>document.write('<script src="../data/art/jp-kyushu.js?t='+T+'"><\/script>');</script>
<script>document.write('<script src="../trips/'+(new URLSearchParams(location.search).get('trip')||'kyushu-2026')+'/trip.js?t='+T+'"><\/script>');</script>
<script>
/* 色盤與名稱都從行程的 regions[] 來，跟 App 走同一份資料 */
var Q = new URLSearchParams(location.search);
var REGS = (window.TRIP && TRIP.regions) || [];
var PAL = ['rb','sky','far','mid','near','pop','pale'];
var st = document.createElement('style');
st.textContent = REGS.map(function (r) {
  var p = r.palette || {};
  return '[data-art="' + r.art + '"]{' + PAL.map(function (k) {
    return (k === 'rb' ? '--rb:' : '--c-' + k + ':') + (p[k] || '#8a8a8a');
  }).join(';') + '}';
}).join('\n');
document.head.appendChild(st);
var NAME = {}, ARTOF = {};
REGS.forEach(function (r) { NAME[r.art] = r.name; ARTOF[r.art] = r.id; });

if (location.search.indexOf('dark') >= 0) document.documentElement.setAttribute('data-theme', 'dark');
ART.mount();
if (Q.get('cols')) document.getElementById('host').style.gridTemplateColumns = 'repeat(' + Q.get('cols') + ',1fr)';
var ONLY = Q.get('only') ? Q.get('only').split(',') : null;
var LIST = Object.keys(ART.scenes).filter(function (k) { return !ONLY || ONLY.indexOf(k) >= 0 || ONLY.indexOf(ARTOF[k]) >= 0; });
document.getElementById('host').innerHTML = LIST.map(function (k) {
  return '<div class="box" data-art="' + k + '" data-reg="' + (ARTOF[k] || '') + '"><div class="art">' + ART.svg(k, 'scene', 'xMidYMid meet') + '</div>'
    + '<div class="cap"><b>' + (NAME[k] || '（未被任何地區使用）') + '</b><span>' + k + '</span><span class="sw">'
    + ['--c-sky','--c-far','--c-mid','--c-near','--c-pop','--c-pale'].map(function (v) { return '<i style="background:var(' + v + ')"></i>'; }).join('')
    + '</span></div></div>';
}).join('');
document.getElementById('stamps').innerHTML = LIST.map(function (k) {
  return '<span class="stamp" data-art="' + k + '">' + ART.svg(k, 'scene', 'xMidYMid slice') + '</span>';
}).join('');
</script>
</body></html>
